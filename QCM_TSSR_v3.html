  "Quel port utilise LDAP ?": "LDAP (Lightweight Directory Access Protocol) utilise le port 389. C'est le protocole d'annuaire (Active Directory, OpenLDAP). Version sécurisée LDAPS sur le port 636. Quand tu te logues sur Windows en domaine, c'est LDAP qui interroge l'AD.",
  "Quel port utilise LDAPS (sécurisé) ?": "LDAPS = LDAP + SSL/TLS sur le port 636 en TCP. Toujours préférer LDAPS à LDAP simple (389) pour éviter de transmettre les mots de passe en clair. Particulièrement important quand on configure des applications externes qui s'authentifient sur l'AD.",
  "Quel port utilise MySQL ?": "MySQL utilise le port 3306 en TCP. Comme tous les ports de bases de données, à n'exposer que sur le réseau interne, jamais sur Internet. Si MySQL est sur le même serveur que l'application, on peut même utiliser le socket local pour plus de performance et sécurité.",
  "Quel port utilise NTP ?": "NTP (Network Time Protocol) utilise le port 123 en UDP. Il synchronise l'horloge des machines avec un serveur de temps. Capital pour Active Directory (Kerberos refuse une dérive de plus de 5 minutes), pour les logs cohérents et les certificats SSL.",
  "Quel port utilise POP3 ?": "POP3 (Post Office Protocol v3) utilise le port 110. Il télécharge les mails du serveur et les supprime (par défaut). Version sécurisée : POP3S sur 995. Aujourd'hui, on préfère IMAP qui synchronise au lieu de télécharger.",
  "Quel port utilise PostgreSQL ?": "PostgreSQL utilise le port 5432 en TCP. Même règle de sécurité : jamais sur Internet. Le fichier pg_hba.conf permet de restreindre quelles IP peuvent se connecter, complémentaire au pare-feu réseau.",
  "Quel port utilise RADIUS ?": "RADIUS = Remote Authentication Dial-In User Service. 2 ports UDP : 1812 (authentification, le plus important) et 1813 (accounting/comptabilité). Utilisé pour authentifier les utilisateurs Wi-Fi (WPA2 Enterprise), VPN, accès admin sur switches. Souvent couplé à AD via Microsoft NPS (Network Policy Server).",
  "Quel port utilise RDP ?": "RDP (Remote Desktop Protocol) utilise le port 3389 en TCP. C'est la prise en main à distance de Windows (Bureau à distance). À NE JAMAIS exposer directement sur Internet — utiliser un VPN devant. Cible n°1 des ransomwares.",
  "Quel port utilise SIP ?": "SIP utilise le port 5060 (TCP/UDP) en clair, ou 5061 en TLS chiffré. Souvent le port 5060 est ouvert pour permettre la VoIP, mais ATTENTION : c'est une cible privilégiée des attaquants (fraude téléphonique, appels surtaxés). Toujours sécuriser : VLAN dédié voix, restriction des IP source.",
  "Quel port utilise SMB / CIFS ?": "SMB (Server Message Block, aussi appelé CIFS) utilise le port 445 en TCP. C'est le protocole de partage de fichiers Windows (lecteurs réseau, imprimantes partagées). Cible historique : c'est le port qu'a exploité WannaCry en 2017 via la faille EternalBlue.",
  "Quel port utilise SMB/CIFS ?": "SMB (Server Message Block, aussi appelé CIFS) sur le port 445 en TCP. Protocole de partage de fichiers et imprimantes Windows. C'est ce que tu utilises quand tu accèdes à \\\\serveur\\partage. Cible historique des attaques (WannaCry 2017 via faille EternalBlue). Toujours désactiver SMBv1 (obsolète et faillé).",
  "Quel port utilise SMTP ?": "SMTP (Simple Mail Transfer Protocol) utilise le port 25 pour l'envoi de mails entre serveurs. Pour l'envoi par les clients (Outlook, Thunderbird), on utilise plutôt 587 (SMTP authentifié) ou 465 (SMTPS, chiffré). Le port 25 est souvent bloqué par les FAI pour limiter les spams.",
  "Quel port utilise SNMP ?": "SNMP utilise le port 161 (UDP) pour les requêtes et 162 pour les traps (alertes). C'est le standard de supervision réseau : Nagios, Zabbix, Centreon l'utilisent pour interroger switches, routeurs, serveurs. Toujours désactiver SNMPv1/v2 (non chiffré) au profit de SNMPv3.",
  "Quel port utilise SSH ?": "SSH (Secure Shell) utilise le port 22 en TCP. Il permet de se connecter à distance sur un serveur Linux/Unix de manière chiffrée. Bonne pratique de sécurité : changer le port 22 par défaut pour limiter les attaques automatisées (par exemple le mettre sur 2222).",
  "Quel port utilise Syslog ?": "Syslog utilise le port 514 en UDP par défaut (TCP en option, plus fiable). C'est le standard de centralisation des logs sur Linux/Unix et la plupart des équipements réseau. Indispensable pour la sécurité (corrélation d'événements) et le diagnostic.",
  "Quel port utilise TFTP ?": "TFTP = Trivial FTP : port 69 en UDP. Version SIMPLIFIÉE de FTP : pas d'authentification, pas de listing de répertoire, juste GET et PUT. Utilisé pour : boot PXE (téléchargement de bootloader), configuration des switches Cisco, mises à jour de firmware. Jamais en environnement non maîtrisé !",
  "Quel port utilise Telnet ?": "Telnet utilise le port 23 en TCP. C'est l'ancêtre de SSH, totalement non sécurisé (tout en clair). Encore présent sur de vieux équipements réseau. À remplacer impérativement par SSH dès que possible.",
  "Quel protocole résout une adresse IP en adresse MAC ?": "ARP (Address Resolution Protocol). Quand un PC veut parler à 192.168.1.5, il fait un broadcast ARP : 'Qui a 192.168.1.5 ?'. La machine concernée répond avec son adresse MAC. Les correspondances sont mises en cache (commande arp -a pour voir). ARP travaille à la frontière des couches 2 et 3.",
  "Quelle commande affiche l'espace disque disponible ?": "df -h (disk free, h = human readable : Go au lieu de blocs). Affiche tous les systèmes de fichiers montés avec leur taux d'occupation. Astuce : df -hT pour voir aussi le type (ext4, xfs, etc). Pour analyser un dossier précis : du -sh /chemin (taille totale en H readable).",
  "Quelle commande affiche la configuration réseau sous Linux ?": "ip a (moderne, recommandé) ou ifconfig (ancien, sur certaines distros pas installé par défaut). 'ip address' montre les IP des interfaces. Pour voir l'état UP/DOWN : ip link. Pour configurer en live : ip addr add 192.168.1.10/24 dev eth0.",
  "Quelle commande affiche la configuration réseau sous Windows ?": "ipconfig /all donne TOUT : IP, masque, passerelle, DNS, MAC, état DHCP, nom DNS, adresses IPv6, suffixes DNS. ipconfig (sans /all) ne donne que l'essentiel. Indispensable pour diagnostiquer 'pourquoi je n'ai pas Internet'.",
  "Quelle commande affiche la table de routage sous Linux ?": "ip route show (commande moderne) ou route -n (ancienne, en chiffres pour aller plus vite). Indispensable pour diagnostiquer. Pour ajouter une route temporaire : ip route add 192.168.10.0/24 via 192.168.1.1. Pour persistance : config réseau (interfaces, netplan).",
  "Quelle commande affiche la table de routage sous Windows ?": "route print (ou netstat -r). Affiche toutes les routes connues, avec destination, masque, passerelle, interface, métrique. Diagnostiquer un problème de routage commence souvent ici. Pour ajouter : route add. Pour supprimer : route delete.",
  "Quelle commande affiche le répertoire courant sous Linux ?": "pwd = Print Working Directory. Affiche le chemin absolu du dossier dans lequel tu te trouves. Indispensable quand tu navigues en SSH et que tu te perds dans l'arborescence. Astuce : ajouter pwd dans le prompt PS1 pour toujours voir où tu es.",
  "Quelle commande affiche les processus en cours ?": "ps aux (a=tous, u=détails utilisateur, x=hors tty). Snapshot statique. Pour interactif et tri en temps réel : top (ou htop, plus joli). Combinaisons utiles : ps aux | grep apache (chercher un processus), ps -ef --forest (arbre des processus).",
  "Quelle commande crée un partage réseau en ligne de commande ?": "net share NomPartage=C:\\Dossier /grant:utilisateur,FULL crée un partage avec droits complets. Alternatives : New-SmbShare en PowerShell (plus puissant), interface graphique via clic droit > Partager. Toujours coupler avec les droits NTFS pour une vraie sécurité.",
  "Quelle commande force l'application des GPO ?": "gpupdate /force met à jour TOUTES les GPO immédiatement (sans attendre le cycle de 90 minutes par défaut). Le /force réapplique même celles qui n'ont pas changé. Souvent suivi d'un redémarrage si la GPO concerne le démarrage. À utiliser quand tu veux tester une nouvelle GPO sans attendre.",
  "Quelle commande liste les fichiers avec détails sous Linux ?": "ls -la affiche tous les fichiers (a = all, y compris les cachés .fichier) avec détails (l = long format : droits, propriétaire, taille, date). Combinaisons utiles : ls -lah (h = human readable, taille en Ko/Mo), ls -ltr (par date croissante).",
  "Quelle commande liste les rôles FSMO ?": "netdom query fsmo (en CMD) ou Get-ADDomain | Select-Object *Master* (PowerShell). Pour transférer un rôle : ntdsutil ou Move-ADDirectoryServerOperationMasterRole. Rare au quotidien, mais critique en cas de perte d'un DC porteur.",
  "Quelle commande recherche du texte dans un fichier sous Linux ?": "grep \"texte\" fichier.txt. Options puissantes : -i (insensible à la casse), -r (récursif dans un dossier), -n (numéros de ligne), -v (inverser : lignes SANS le motif). Combiné avec un pipe : tail -100 syslog | grep ERROR. C'est l'outil de fouille #1.",
  "Quelle commande se connecter en SSH ?": "ssh utilisateur@adresse_ip (ou nom DNS). Premier login : confirmation de l'empreinte (fingerprint). Options utiles : -p port (si port modifié), -i clé.pem (auth par clé). Bonne pratique : authentification par clé SSH plutôt que mot de passe, et désactiver root login.",
  "Quelle commande teste la connectivité réseau ?": "ping adresse_ip (ou nom DNS). Utilise ICMP echo request/reply. Si ça répond, la cible est joignable jusqu'en couche 3. Attention : certains firewalls bloquent ICMP, donc 'ping ne passe pas' ne signifie pas toujours 'serveur down'. Tester aussi avec un port précis (telnet IP port).",
  "Quelle commande trace le chemin vers une destination ?": "Windows : tracert. Linux/macOS : traceroute. Affiche tous les routeurs entre toi et la cible (chaque 'saut'). Utile pour identifier OÙ ça bloque (ton réseau ? le FAI ? le datacenter cible ?). Variante : mtr (combine ping + traceroute en continu, super pratique).",
  "Quelle commande vérifie les GPO appliquées ?": "gpresult /r affiche un résumé des GPO appliquées sur la machine. /h pour un rapport HTML détaillé (gpresult /h rapport.html). Indispensable pour diagnostiquer 'pourquoi cette GPO ne s'applique pas' — souvent un problème de filtrage de sécurité ou d'OU.",
  "Quelle différence entre Cat5e et Cat6 ?": "Cat5e : 1 Gbit/s sur 100m, économique, suffisant pour le bureau standard. Cat6 : jusqu'à 10 Gbit/s sur 55m (1 Gbit/s sur 100m), meilleure résistance aux interférences. Cat6a : 10 Gbit/s sur 100m, devenu le standard pour les nouvelles installations professionnelles.",
  "Quelle différence entre Exchange on-premise et Exchange Online ?": "ON-PREMISE : serveurs Exchange installés DANS l'entreprise (auto-hébergement). Avantage : contrôle total, données chez soi. Inconvénient : maintenance lourde, mises à jour, sauvegardes. ONLINE : Exchange dans le cloud Microsoft (Microsoft 365). Plus de serveurs à gérer, mises à jour auto, mais dépendance à Microsoft et coût récurrent par utilisateur.",
  "Quelle différence entre IDS et IPS ?": "IDS (Detection) : DÉTECTE et ALERTE — il observe le trafic pour identifier des comportements suspects. Mode passif. IPS (Prevention) : DÉTECTE ET BLOQUE automatiquement — il agit en temps réel. Mode actif. L'IPS = IDS + capacité d'action. Risque IPS : faux positifs qui bloquent du trafic légitime.",
  "Quelle différence entre PRA et PCA ?": "PRA = on ACCEPTE une coupure et on RESTAURE après le sinistre (RTO de plusieurs heures à jours). Coût modéré. PCA = ZÉRO interruption, le service continue PENDANT le sinistre (RTO proche de 0). Coût élevé (sites doublés). En pratique, on combine : PCA pour les services critiques, PRA pour le reste.",
  "Quelle différence entre VPN client-to-site et site-to-site ?": "CLIENT-TO-SITE : un poste isolé (télétravailleur) se connecte au réseau de l'entreprise. C'est ce que tu utilises avec un client VPN (Cisco AnyConnect, OpenVPN). SITE-TO-SITE : 2 réseaux entiers (siège et filiale) sont reliés en permanence via un tunnel entre 2 routeurs/firewalls — totalement transparent pour les utilisateurs.",
  "Quelle différence entre chiffrement symétrique et asymétrique ?": "SYMÉTRIQUE : 1 SEULE clé partagée (chiffre + déchiffre). Très rapide, gros volumes. Standard : AES-256. Souci : comment échanger la clé en sécurité ? ASYMÉTRIQUE : 2 clés (publique + privée), résout le problème d'échange. Plus lent. Standards : RSA, ECC. SOLUTION RÉELLE : on utilise les DEUX (asymétrique pour échanger la clé symétrique, symétrique pour les données — c'est ce que fait HTTPS).",
  "Quelle différence entre cloud public, privé et hybride ?": "PUBLIC : ressources mutualisées chez un fournisseur (AWS, Azure, GCP), accessible via Internet. PRIVÉ : infrastructure dédiée à une seule organisation (peut être on-premise ou hébergée). HYBRIDE : combinaison des deux — données sensibles en privé, élasticité en public. La majorité des grandes entreprises sont en hybride.",
  "Quelle différence entre fibre monomode et multimode ?": "MONOMODE : un seul rayon lumineux dans un coeur très fin (9 µm), longue distance (jusqu'à 100 km), couleur jaune. Plus chère (laser plus précis). Pour interconnexion entre sites, datacenters. MULTIMODE : plusieurs rayons dans un coeur plus gros (50 ou 62.5 µm), courte distance (qq centaines de mètres max), couleur orange/aqua. Moins chère. Pour réseaux internes.",
  "Quelle différence entre hyperviseur Type 1 et Type 2 ?": "Type 1 (bare-metal) : s'installe DIRECTEMENT sur le matériel, pas d'OS hôte (ESXi, Hyper-V Server, Proxmox, KVM). Plus performant et plus sûr — pour la production. Type 2 (hosted) : s'installe sur un OS existant comme un logiciel (VirtualBox, VMware Workstation, Hyper-V sur Win10). Pour le test, le développement.",
  "Quelle différence entre image thick et thin ?": "THICK : image COMPLÈTE avec OS + TOUTES les apps. Fichier énorme, mais déploiement rapide (tout est dedans). THIN : image MINIMALE (juste l'OS), les apps sont installées APRÈS via des packages (App-V, MSI, Chocolatey). Plus flexible, mais déploiement plus long. Variante : 'hybrid' (apps de base dans l'image, le reste post-install).",
  "Quelle différence entre pare-feu réseau et WAF ?": "PARE-FEU RÉSEAU : analyse couches 3-4 (IP source, IP destination, ports, protocole) — bloque selon des règles classiques. WAF (Web Application Firewall) : analyse la couche 7 (contenu HTTP, paramètres, JSON) — détecte les attaques web (SQL injection, XSS, CSRF). Ils sont COMPLÉMENTAIRES et non concurrents.",
  "Quelle différence entre sauvegarde incrémentale et différentielle ?": "INCRÉMENTALE : sauvegarde uniquement ce qui a changé depuis la DERNIÈRE sauvegarde (qu'elle soit complète ou incr). Très RAPIDE et léger, mais restauration = complète + toutes les incr depuis. DIFFÉRENTIELLE : sauvegarde ce qui a changé depuis la dernière COMPLÈTE. Plus volumineuse mais restauration = complète + UNE diff (plus simple).",
  "Quelle est la PDU de la couche 2 ?": "PDU = Protocol Data Unit, l'unité de données traitée à chaque couche. Couche 2 = trame (frame). C'est l'unité que manipulent les switches Ethernet. Elle contient les adresses MAC source et destination ainsi qu'un FCS pour détecter les erreurs.",
  "Quelle est la PDU de la couche 3 ?": "Au niveau réseau (couche 3), l'unité s'appelle paquet. Le paquet IP contient les adresses IP source et destination, plus le TTL (Time To Live) qui empêche les boucles infinies. C'est ce que les routeurs analysent pour décider du chemin à suivre.",
  "Quelle est la PDU de la couche 4 ?": "En transport (couche 4), TCP utilise des segments, UDP utilise des datagrammes. C'est à ce niveau que sont ajoutés les ports (source/destination) qui permettent à plusieurs applications de cohabiter sur une même machine — par exemple un navigateur (port aléatoire) qui parle à un serveur web (port 443).",
  "Quelle est la couche 1 du modèle OSI ?": "La couche Physique gère TOUT ce qui est tangible : câbles cuivre/fibre, ondes Wi-Fi, signaux électriques, connecteurs RJ45. Elle transmet juste des bits bruts (0 et 1) sans se soucier de leur signification. Si ton câble est débranché, c'est un problème couche 1.",
  "Quelle est la couche 2 du modèle OSI ?": "La couche Liaison de données structure les bits en trames et utilise les adresses MAC (gravées dans la carte réseau). C'est la couche des switches, du protocole ARP (qui associe IP↔MAC), et du Wi-Fi (802.11). Si ton switch a un problème de VLAN, c'est couche 2.",
  "Quelle est la couche 3 du modèle OSI ?": "La couche Réseau permet le routage entre différents réseaux grâce aux adresses IP. C'est ici que travaillent les routeurs et le protocole ICMP (utilisé par ping). Si tu n'arrives pas à joindre un autre réseau, c'est probablement couche 3.",
  "Quelle est la couche 4 du modèle OSI ?": "La couche Transport assure la livraison des données entre applications via les ports. TCP garantit la fiabilité (accusés de réception, retransmission), UDP fonce sans contrôle (plus rapide, mais peut perdre des paquets). Quand tu ouvres un port sur un firewall, tu travailles en couche 4.",
  "Quelle est la couche 5 du modèle OSI ?": "La couche Session ouvre, gère et ferme les sessions de communication entre deux machines. Elle gère par exemple les sessions NetBIOS, RPC, ou les connexions persistantes. C'est la couche la moins visible au quotidien, mais essentielle pour les applications client-serveur.",
  "Quelle est la couche 6 du modèle OSI ?": "La couche Présentation s'occupe du formatage des données : chiffrement (TLS/SSL), compression, encodage (UTF-8, ASCII). Quand tu vois HTTPS dans ton navigateur, c'est la couche 6 qui chiffre. Elle traduit les données pour qu'elles soient compréhensibles par l'application.",
  "Quelle est la couche 7 du modèle OSI ?": "La couche Application est celle que voit l'utilisateur : navigateur web (HTTP), client mail (SMTP/IMAP), transfert de fichiers (FTP), DNS. C'est ici que vivent les protocoles 'métier'. Quand un utilisateur dit 'je n'arrive pas à envoyer mon mail', c'est couche 7.",
  "Quelle est la différence entre POP3 et IMAP ?": "POP3 (port 110) : TÉLÉCHARGE les mails sur l'appareil et les SUPPRIME du serveur (par défaut). Tes mails ne sont plus accessibles depuis un autre appareil. Modèle 'old school'. IMAP (port 143) : SYNCHRONISE les mails, qui restent sur le serveur. Tu vois les mêmes mails sur ton PC, ton téléphone, ton webmail. Standard moderne.",
  "Quelle est la différence entre TCP et UDP ?": "TCP est fiable mais plus lent : il établit une connexion (handshake 3-way), accuse réception, retransmet en cas de perte (utilisé pour HTTP, SSH, mail). UDP est rapide mais 'fire-and-forget' : pas de garantie de livraison (utilisé pour DNS, VoIP, streaming, jeux). Le choix dépend de ce qui est plus important : fiabilité ou vitesse.",
  "Quelle est la différence entre droits NTFS et droits de partage ?": "Les droits NTFS s'appliquent partout (local + réseau), les droits de Partage uniquement quand on accède via le réseau (\\\\serveur\\partage). Quand les deux s'appliquent, c'est la règle la plus restrictive qui gagne. Bonne pratique : Partage = Tout le monde / Contrôle Total, et on gère finement avec NTFS.",
  "Quelle est la différence entre un incident et une demande ?": "Distinction fondamentale d'ITIL : un INCIDENT = quelque chose ne marche plus (l'imprimante ne répond pas, le mail est down). Une DEMANDE = quelque chose de standard à fournir (créer un compte, installer Office, donner un accès). Les SLA et les processus sont différents pour chaque catégorie.",
  "Quelle est la plage d'adresses de 192.168.1.0/26 ?": "Avec /26, taille du sous-réseau = 64 adresses. Les sous-réseaux dans 192.168.1.x sont : 0-63, 64-127, 128-191, 192-255. Pour 192.168.1.0/26 : Réseau=192.168.1.0, Première IP utilisable=192.168.1.1, Dernière IP utilisable=192.168.1.62, Broadcast=192.168.1.63.",
  "Quelles questions poser à un utilisateur en panne ?": "Méthode QQOQCP : Qui (impact), Quoi (description précise du symptôme), Où (poste, salle), Quand (depuis quand, quelle action déclenche), Comment (message d'erreur), Pourquoi (changement récent ?). Toujours demander : 'Avez-vous redémarré ?' et 'Y a-t-il un message à l'écran ?'.",
  "Quelles questions poser à un utilisateur en premier ?": "Méthode QQOQCP/CHEMIN : 1) Quel est le problème exact ? 2) Depuis quand ? 3) Qu'avez-vous fait juste avant ? 4) Avez-vous redémarré ? Ces 4 questions permettent de cadrer 80% des cas. Toujours noter les réponses dans le ticket.",
  "Quelles sont les 4 étapes de résolution d'un incident (ITIL) ?": "1) DÉTECTION (l'incident remonte par appel, mail, supervision), 2) DIAGNOSTIC (analyse, identifier la cause racine), 3) RÉSOLUTION (appliquer le correctif, valider), 4) CLÔTURE (informer l'utilisateur, documenter, fermer le ticket). Sauter une étape = problème qui revient.",
  "Quelles sont les 4 étapes du traitement d'un incident ?": "1) DÉTECTION (l'incident est signalé/détecté), 2) DIAGNOSTIC (analyse, identification de la cause), 3) RÉSOLUTION (correction du problème), 4) CLÔTURE (validation avec l'utilisateur, documentation, fermeture du ticket). Sauter une étape = ticket mal traité, problème qui revient.",
  "Quelles sont les plages d'adresses IP privées ?": "RFC 1918 — les 3 plages réservées au privé (non routées sur Internet) : 10.0.0.0/8 (classe A, 16M IPs), 172.16.0.0/12 (classe B, 1M IPs), 192.168.0.0/16 (classe C, 65K IPs). Ce sont CES adresses qui sont dans tes réseaux d'entreprise. Pour aller sur Internet, le NAT traduit en IP publique.",
  "Quels logiciels de sauvegarde connais-tu ?": "Veeam (#1 pour VM), Windows Server Backup (gratuit, basique), Acronis (entreprise), Bacula (libre, complet), rsync (Linux, syncho fichiers), Duplicati (libre cross-platform), Cohesity/Rubrik (haut de gamme). Veeam est devenu le standard pour les environnements virtualisés.",
  "Quels ports retenir absolument pour le TSSR ?": "Les incontournables : 22 (SSH), 53 (DNS), 80/443 (HTTP/HTTPS), 25 (SMTP), 110 (POP3), 143 (IMAP), 389 (LDAP), 88 (Kerberos), 3389 (RDP), 67/68 (DHCP), 161 (SNMP), 445 (SMB), 21 (FTP), 23 (Telnet), 123 (NTP). Ils tombent quasi-systématiquement à l'examen.",
  "Quels ports utilise DHCP ?": "DHCP utilise 2 ports UDP : 67 (serveur, écoute les demandes) et 68 (client, reçoit les réponses). DHCP attribue automatiquement IP, masque, passerelle et DNS aux postes du réseau. Indispensable pour ne pas configurer chaque PC à la main.",
  "Quels ports utilise SQL Server ?": "SQL Server utilise le port 1433 en TCP par défaut. À ne jamais exposer sur Internet — toujours derrière un firewall, accessible uniquement depuis les serveurs applicatifs. Une instance nommée peut utiliser un port dynamique avec le service SQL Browser sur 1434.",
  "Quels sont les 3 niveaux de support ?": "N1 = premier contact (réinitialiser un mot de passe, déblocages simples). N2 = analyse plus poussée (config, escalade aux experts). N3 = experts métier ou fournisseurs (problèmes complexes, bugs logiciels). L'escalade se fait quand le niveau précédent atteint sa limite — toujours documenter avant d'escalader.",
  "Quels sont les 3 types de sauvegarde ?": "1) COMPLÈTE : tout est sauvegardé (long, beaucoup d'espace, mais restauration simple). 2) DIFFÉRENTIELLE : ce qui a changé depuis la DERNIÈRE COMPLÈTE (taille croissante, restauration = complète + dernière diff). 3) INCRÉMENTALE : ce qui a changé depuis la DERNIÈRE SAUVEGARDE (petite, mais restauration = complète + TOUTES les incr).",
  "Quels sont les droits NTFS de base ?": "Les 5 niveaux : Lecture (consulter), Écriture (créer/modifier), Lecture+Exécution (lire et lancer), Modification (incluant suppression), Contrôle Total (incluant changer les droits eux-mêmes). En détail, il y a 14 droits 'spéciaux'. Bonne pratique : on n'attribue Contrôle Total qu'aux admins.",
  "Quels sont les principaux enregistrements DNS ?": "A (nom → IPv4), AAAA (nom → IPv6), CNAME (alias d'un autre nom), MX (serveur mail du domaine), NS (serveur DNS faisant autorité), PTR (IP → nom, recherche inversée), TXT (texte libre, souvent SPF/DKIM/DMARC pour antispam). Chacun a un rôle précis à connaître.",
  "Quels sont les protocoles de la couche 7 ?": "La couche Application regroupe les protocoles 'utilisateurs' : HTTP/HTTPS (web), SMTP (envoi mail), POP3/IMAP (réception mail), FTP (fichiers), DNS (résolution noms), DHCP (config IP), SSH (connexion distante), Telnet, SNMP. Ce sont les protocoles que tu manipules au quotidien.",
  "À quelle couche OSI travaille un routeur ?": "Le routeur travaille en couche 3 (Réseau). Il analyse les adresses IP des paquets pour décider du meilleur chemin entre deux réseaux. Il maintient une 'table de routage' avec les destinations connues et les passerelles à utiliser. Indispensable pour faire communiquer plusieurs réseaux distincts.",
  "À quelle couche OSI travaille un switch ?": "Le switch travaille en couche 2 (Liaison de données). Il analyse les adresses MAC des trames pour décider sur quel port envoyer le trafic. Il maintient une 'table MAC' (correspondance MAC ↔ port) qu'il construit en observant les trames qui passent. Les switches modernes 'L3' peuvent aussi router en couche 3.",
};

const ALL_TAGS = ["Anglais", "Attaques", "C1-Support", "C2-Windows", "C3-Linux", "C4-Reseau", "C5-Virtualisation", "C6-Scripts", "C7-Securite", "C8-Sauvegardes", "C9-Deploiement", "Cablage", "Calcul-Reseau", "Messagerie", "OSI", "Ports", "RAID", "Supervision", "Veille-Eco", "VoIP"];
const TAG_DISPLAY = {"OSI": "🏗 OSI", "Ports": "🚪 Ports", "C1-Support": "🎫 Support", "C2-Windows": "🪟 Windows", "C3-Linux": "🐧 Linux", "C4-Reseau": "🌐 Réseau", "C5-Virtualisation": "☁️ Virtualisation", "C6-Scripts": "⚙️ Scripts", "C7-Securite": "📡 Sécurité", "C8-Sauvegardes": "💾 Sauvegardes", "C9-Deploiement": "🚀 Déploiement", "Anglais": "🇬🇧 Anglais", "Calcul-Reseau": "🔢 Calcul réseau", "VoIP": "📞 VoIP", "Supervision": "📊 Supervision", "Messagerie": "📧 Messagerie", "Cablage": "🔌 Câblage", "Attaques": "🛡 Attaques", "RAID": "💿 RAID", "Veille-Eco": "🌿 Veille & Éco"};


/* ═══════════════════
   STATE
   ═══════════════════ */
let selectedTags = new Set();
let quizQuestions = [];
let currentIdx = 0;
let correctCount = 0;
let wrongCount = 0;
let wrongQuestions = [];
let answered = false;

/* ═══════════════════
   START SCREEN
   ═══════════════════ */
function buildTagGrid() {
  const grid = document.getElementById('tag-grid');
  grid.innerHTML = '';
  ALL_TAGS.forEach(tag => {
    const count = ALL_QUESTIONS.filter(q => q.tag === tag).length;
    const display = TAG_DISPLAY[tag] || tag;
    const btn = document.createElement('button');
    btn.className = 'tag-btn';
    btn.dataset.tag = tag;
    btn.innerHTML = `<span>${display}</span><span class="tag-count">${count}</span>`;
    btn.onclick = () => toggleTag(tag, btn);
    grid.appendChild(btn);
  });
}

function toggleTag(tag, btn) {
  if (selectedTags.has(tag)) {
    selectedTags.delete(tag);
    btn.classList.remove('active');
  } else {
    selectedTags.add(tag);
    btn.classList.add('active');
  }
  updateSelectedCount();
}

function selectAll() {
  ALL_TAGS.forEach(tag => selectedTags.add(tag));
  document.querySelectorAll('.tag-btn').forEach(b => b.classList.add('active'));
  updateSelectedCount();
}

function selectNone() {
  selectedTags.clear();
  document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
  updateSelectedCount();
}

function updateSelectedCount() {
  const count = ALL_QUESTIONS.filter(q => selectedTags.has(q.tag)).length;
  document.getElementById('selected-count').textContent = count;
}

/* ═══════════════════
   QUIZ LOGIC
   ═══════════════════ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  if (selectedTags.size === 0) {
    selectAll();
  }
  quizQuestions = shuffle(ALL_QUESTIONS.filter(q => selectedTags.has(q.tag)));
  if (quizQuestions.length === 0) return;

  currentIdx = 0;
  correctCount = 0;
  wrongCount = 0;
  wrongQuestions = [];
  answered = false;

  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  document.getElementById('header').style.display = 'flex';
  document.getElementById('progress-bar').style.display = 'block';
  document.getElementById('score-correct').textContent = '0';
  document.getElementById('score-wrong').textContent = '0';

  showQuestion();
}

function retryWrong() {
  if (wrongQuestions.length === 0) { backToStart(); return; }
  quizQuestions = shuffle(wrongQuestions);
  currentIdx = 0;
  correctCount = 0;
  wrongCount = 0;
  wrongQuestions = [];
  answered = false;

  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  document.getElementById('header').style.display = 'flex';
  document.getElementById('progress-bar').style.display = 'block';
  document.getElementById('score-correct').textContent = '0';
  document.getElementById('score-wrong').textContent = '0';

  showQuestion();
}

function generateChoices(questionObj) {
  const correct = questionObj.a;
  const correctClean = questionObj.a_clean;
  const tag = questionObj.tag;

  /* Get wrong answers: prefer same tag, then random */
  let pool = ALL_QUESTIONS.filter(q => q.a_clean !== correctClean);
  let sameTag = pool.filter(q => q.tag === tag);
  let otherTag = pool.filter(q => q.tag !== tag);

  /* Pick 3 distractors: 2 from same tag if possible, 1 from other */
  sameTag = shuffle(sameTag);
  otherTag = shuffle(otherTag);

  let distractors = [];
  let usedAnswers = new Set([correctClean]);

  function addDistractor(source) {
    for (const q of source) {
      if (!usedAnswers.has(q.a_clean) && distractors.length < 3) {
        distractors.push(q.a);
        usedAnswers.add(q.a_clean);
      }
    }
  }

  addDistractor(sameTag);
  addDistractor(otherTag);

  /* Fallback if not enough */
  while (distractors.length < 3) {
    distractors.push("Aucune des autres réponses");
  }

  /* Shuffle all 4 choices */
  let choices = shuffle([
    { html: correct, isCorrect: true },
    ...distractors.map(d => ({ html: d, isCorrect: false }))
  ]);

  return choices;
}

function showQuestion() {
  answered = false;
  const q = quizQuestions[currentIdx];
  const display = TAG_DISPLAY[q.tag] || q.tag;

  document.getElementById('question-tag').textContent = display;
  document.getElementById('question-number').textContent = (currentIdx + 1) + ' / ' + quizQuestions.length;
  document.getElementById('question-text').textContent = q.q;
  document.getElementById('explanation').style.display = 'none';
  document.getElementById('next-zone').style.display = 'none';

  /* Progress */
  const pct = (currentIdx / quizQuestions.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';

  /* Choices */
  const choices = generateChoices(q);
  const container = document.getElementById('choices');
  container.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];

  choices.forEach((c, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-letter">${letters[idx]}</span><span class="choice-text">${c.html}</span>`;
    btn.onclick = () => selectChoice(btn, c.isCorrect, container, q);
    container.appendChild(btn);
  });

  /* Scroll to top */
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectChoice(btn, isCorrect, container, q) {
  if (answered) return;
  answered = true;

  /* Mark all buttons as disabled */
  container.querySelectorAll('.choice-btn').forEach(b => {
    b.classList.add('disabled');
    /* Find the correct one and mark it green */
    if (b.querySelector('.choice-text').innerHTML === q.a) {
      b.classList.add('correct');
    } else if (b !== btn) {
      b.classList.add('dimmed');
    }
  });

  if (isCorrect) {
    btn.classList.add('correct');
    correctCount++;
    document.getElementById('score-correct').textContent = correctCount;
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    wrongQuestions.push(q);
    document.getElementById('score-wrong').textContent = wrongCount;
  }

  /* Show explanation — rich version */
  const exp = document.getElementById('explanation');
  const memo = MEMOS[q.q] || null;
  const memoHtml = memo ? `<div class="memo"><div class="memo-label">💡 Astuce mémo</div>${memo}</div>` : '';
  
  /* Get pedagogical explanation */
  const pedagogy = EXPLANATIONS[q.q] || null;
  const pedagogyHtml = pedagogy 
    ? `<div class="pedagogy"><div class="pedagogy-label">📖 Pour bien comprendre</div>${pedagogy}</div>`
    : '';
  
  if (isCorrect) {
    exp.className = 'correct';
    exp.innerHTML = `
      <div class="exp-header">
        <div class="exp-icon">✓</div>
        <div>Bonne réponse !</div>
      </div>
      <div class="exp-body">
        <div class="answer-content">${q.a}</div>
        ${pedagogyHtml}
        ${memoHtml}
      </div>
    `;
  } else {
    exp.className = 'wrong';
    exp.innerHTML = `
      <div class="exp-header">
        <div class="exp-icon">✗</div>
        <div>Pas tout à fait...</div>
      </div>
      <div class="exp-body">
        <div class="correct-answer">
          <div class="correct-answer-label">✓ La bonne réponse était</div>
          <div class="answer-content">${q.a}</div>
        </div>
        ${pedagogyHtml}
        ${memoHtml}
      </div>
    `;
  }
  exp.style.display = 'block';

  /* Show next button */
  const nextZone = document.getElementById('next-zone');
  nextZone.style.display = 'block';

  if (currentIdx >= quizQuestions.length - 1) {
    document.getElementById('btn-next').textContent = 'Voir les résultats →';
  } else {
    document.getElementById('btn-next').textContent = 'Question suivante →';
  }
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx >= quizQuestions.length) {
    showResults();
    return;
  }
  showQuestion();
}

/* ═══════════════════
   RESULTS
   ═══════════════════ */
function showResults() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('next-zone').style.display = 'none';
  document.getElementById('header').style.display = 'none';
  document.getElementById('progress-bar').style.display = 'none';
  document.getElementById('results-screen').style.display = 'block';

  const total = correctCount + wrongCount;
  const pct = Math.round((correctCount / total) * 100);

  document.getElementById('results-pct').textContent = pct + '%';
  document.getElementById('final-correct').textContent = correctCount;
  document.getElementById('final-wrong').textContent = wrongCount;

  const circle = document.getElementById('results-circle');
  const title = document.getElementById('results-title');
  const sub = document.getElementById('results-sub');

  if (pct >= 90) {
    circle.style.background = 'var(--green-bg)';
    circle.style.border = '3px solid var(--green)';
    circle.querySelector('.results-pct').style.color = 'var(--green)';
    title.textContent = '🎉 Excellent !';
    sub.textContent = 'Tu maîtrises ce sujet. Continue comme ça pour juillet !';
  } else if (pct >= 70) {
    circle.style.background = 'rgba(251,191,36,0.1)';
    circle.style.border = '3px solid var(--orange)';
    circle.querySelector('.results-pct').style.color = 'var(--orange)';
    title.textContent = '👍 Bien !';
    sub.textContent = 'Bon niveau, mais refais les erreurs pour consolider.';
  } else if (pct >= 50) {
    circle.style.background = 'rgba(251,191,36,0.08)';
    circle.style.border = '3px solid var(--orange)';
    circle.querySelector('.results-pct').style.color = 'var(--orange)';
    title.textContent = '💪 En progrès';
    sub.textContent = 'Continue à réviser, tu progresses ! Refais les erreurs.';
  } else {
    circle.style.background = 'var(--red-bg)';
    circle.style.border = '3px solid var(--red)';
    circle.querySelector('.results-pct').style.color = 'var(--red)';
    title.textContent = '📚 À travailler';
    sub.textContent = 'Ce thème nécessite plus de révision. Pas de panique, refais le quiz !';
  }

  window.scrollTo({ top: 0 });
}

function backToStart() {
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('header').style.display = 'none';
  document.getElementById('progress-bar').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';
}

/* ═══════════════════
   INIT
   ═══════════════════ */
buildTagGrid();
selectAll();
</script>
