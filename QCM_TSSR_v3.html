<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>QCM TSSR · Révision Examen Juillet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0f1a;
  --card: #141829;
  --card-hover: #1a2038;
  --border: rgba(100,140,220,0.12);
  --text: #d8dff0;
  --text-dim: rgba(170,190,225,0.55);
  --accent: #4f7bef;
  --accent-glow: rgba(79,123,239,0.25);
  --green: #34d399;
  --green-bg: rgba(52,211,153,0.12);
  --green-border: rgba(52,211,153,0.4);
  --red: #f87171;
  --red-bg: rgba(248,113,113,0.1);
  --red-border: rgba(248,113,113,0.35);
  --orange: #fbbf24;
  --radius: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height:100%; background:var(--bg); color:var(--text);
  font-family:'DM Sans',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}

/* ── HEADER ── */
#header {
  position:sticky; top:0; z-index:10;
  background:rgba(12,15,26,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:14px 20px;
  display:flex; align-items:center; justify-content:space-between;
}
#header-left { display:flex; align-items:center; gap:10px; }
#header h1 {
  font-size:16px; font-weight:700; letter-spacing:-0.3px;
  background:linear-gradient(135deg,#7ba4f7,#a78bfa);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
#score-badge {
  display:flex; align-items:center; gap:14px;
  font-size:13px; font-family:'JetBrains Mono',monospace;
}
.score-item { display:flex; align-items:center; gap:4px; }
.score-dot { width:8px; height:8px; border-radius:50%; }
.score-dot.green { background:var(--green); }
.score-dot.red { background:var(--red); }

/* ── PROGRESS ── */
#progress-bar {
  height:3px; background:rgba(255,255,255,0.06);
  position:sticky; top:53px; z-index:9;
}
#progress-fill {
  height:100%; width:0%;
  background:linear-gradient(90deg,var(--accent),#a78bfa);
  transition:width 0.5s ease;
}

/* ── START SCREEN ── */
#start-screen {
  min-height:100vh; padding:40px 20px;
  display:flex; flex-direction:column; align-items:center;
  gap:20px;
}
.logo-qcm {
  width:72px; height:72px; border-radius:18px;
  background:linear-gradient(135deg,rgba(79,123,239,0.25),rgba(167,139,250,0.2));
  border:1.5px solid rgba(120,160,255,0.25);
  display:flex; align-items:center; justify-content:center;
  font-size:32px; margin-top:30px;
}
.start-title {
  font-size:26px; font-weight:700; letter-spacing:-0.5px;
  text-align:center; line-height:1.3;
}
.start-sub {
  font-size:13px; color:var(--text-dim); text-align:center;
  line-height:1.7; max-width:320px;
}
.start-stats {
  display:flex; gap:20px; font-size:12px; color:var(--text-dim);
  letter-spacing:0.5px;
}
.start-stats span { font-family:'JetBrains Mono',monospace; color:var(--accent); }

/* ── TAG GRID ── */
.tag-section-title {
  font-size:11px; letter-spacing:2px; text-transform:uppercase;
  color:var(--text-dim); margin-top:10px;
}
#tag-grid {
  display:grid; grid-template-columns:repeat(2,1fr);
  gap:8px; width:100%; max-width:360px;
}
.tag-btn {
  padding:10px 8px; border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text-dim);
  font-size:12px; cursor:pointer;
  font-family:'DM Sans',sans-serif;
  transition:all 0.15s;
  display:flex; align-items:center; gap:6px;
  white-space:nowrap; overflow:hidden;
}
.tag-btn:active { transform:scale(0.96); }
.tag-btn.active {
  background:var(--accent-glow);
  border-color:rgba(79,123,239,0.45);
  color:var(--text);
}
.tag-count {
  margin-left:auto; font-family:'JetBrains Mono',monospace;
  font-size:10px; opacity:0.5;
}

.btn-row { display:flex; gap:8px; width:100%; max-width:360px; }
.btn-main {
  flex:1; padding:14px; border-radius:12px;
  border:1.5px solid rgba(79,123,239,0.4);
  background:rgba(79,123,239,0.15);
  color:#b8d0ff; font-size:15px; font-weight:600;
  cursor:pointer; font-family:'DM Sans',sans-serif;
  transition:all 0.2s; letter-spacing:0.3px;
}
.btn-main:active { transform:scale(0.97); background:rgba(79,123,239,0.3); }
.btn-all {
  padding:14px 18px; border-radius:12px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text-dim); font-size:13px;
  cursor:pointer; font-family:'DM Sans',sans-serif;
  transition:all 0.15s;
}

/* ── QUIZ SCREEN ── */
#quiz-screen { display:none; min-height:100vh; padding:10px 16px 100px; }

#question-card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px 20px;
  margin-bottom:14px;
  position:relative;
}
#question-tag {
  font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
  color:var(--accent); margin-bottom:10px;
  font-family:'JetBrains Mono',monospace;
}
#question-number {
  position:absolute; top:16px; right:18px;
  font-size:11px; color:var(--text-dim);
  font-family:'JetBrains Mono',monospace;
}
#question-text {
  font-size:17px; line-height:1.65; font-weight:500;
  letter-spacing:-0.1px;
}

/* ── CHOICES ── */
#choices { display:flex; flex-direction:column; gap:10px; }
.choice-btn {
  padding:16px 18px; border-radius:12px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text); font-size:14px; line-height:1.55;
  cursor:pointer; text-align:left;
  font-family:'DM Sans',sans-serif;
  transition:all 0.15s;
  display:flex; align-items:flex-start; gap:12px;
  position:relative;
}
.choice-btn:active { transform:scale(0.985); }
.choice-btn:hover { background:var(--card-hover); border-color:rgba(120,160,255,0.25); }
.choice-letter {
  flex-shrink:0;
  width:26px; height:26px; border-radius:8px;
  background:rgba(255,255,255,0.06);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700;
  font-family:'JetBrains Mono',monospace;
  color:var(--text-dim);
}
.choice-text { flex:1; }

/* États après réponse */
.choice-btn.correct {
  background:var(--green-bg) !important;
  border-color:var(--green-border) !important;
}
.choice-btn.correct .choice-letter {
  background:var(--green); color:#0c0f1a;
}
.choice-btn.wrong {
  background:var(--red-bg) !important;
  border-color:var(--red-border) !important;
}
.choice-btn.wrong .choice-letter {
  background:var(--red); color:#0c0f1a;
}
.choice-btn.dimmed {
  opacity:0.4;
}
.choice-btn.disabled { pointer-events:none; }

/* ── EXPLICATION ── */
#explanation {
  display:none;
  margin-top:14px;
  border-radius:14px;
  overflow:hidden;
  font-size:13px; line-height:1.7;
}
#explanation .exp-header {
  padding:12px 18px;
  font-weight:700; font-size:14px;
  display:flex; align-items:center; gap:8px;
  letter-spacing:-0.2px;
}
#explanation .exp-header .exp-icon {
  width:26px; height:26px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700;
  flex-shrink:0;
}
#explanation .exp-body {
  padding:14px 18px 16px;
  background:rgba(255,255,255,0.02);
}
#explanation.correct {
  background:var(--green-bg);
  border:1px solid var(--green-border);
}
#explanation.correct .exp-header {
  background:rgba(52,211,153,0.18);
  color:var(--green);
}
#explanation.correct .exp-icon {
  background:var(--green); color:#0c0f1a;
}
#explanation.wrong {
  background:rgba(248,113,113,0.06);
  border:1px solid rgba(248,113,113,0.3);
}
#explanation.wrong .exp-header {
  background:rgba(248,113,113,0.15);
  color:var(--red);
}
#explanation.wrong .exp-icon {
  background:var(--red); color:#0c0f1a;
}
#explanation .correct-answer {
  margin-top:10px; padding:12px 14px;
  background:var(--green-bg);
  border-left:3px solid var(--green);
  border-radius:6px;
}
#explanation .correct-answer-label {
  font-size:11px; letter-spacing:1px; text-transform:uppercase;
  color:var(--green); font-weight:700;
  margin-bottom:6px;
}
#explanation .answer-content {
  color:var(--text);
  font-size:14px; line-height:1.7;
}
#explanation .answer-content b { color:var(--green); font-weight:600; }

#explanation .pedagogy {
  margin-top:14px;
  padding:14px 16px;
  background:linear-gradient(135deg, rgba(180,140,255,0.08), rgba(180,140,255,0.03));
  border-left:3px solid rgba(180,140,255,0.6);
  border-radius:6px;
  font-size:13.5px;
  line-height:1.75;
  color:rgba(220,210,240,0.95);
}
#explanation .pedagogy-label {
  font-size:11px; letter-spacing:1.2px; text-transform:uppercase;
  color:rgba(180,140,255,0.95); font-weight:700;
  margin-bottom:8px;
}
#explanation .pedagogy b { color:rgb(210,180,255); font-weight:600; }
#explanation .pedagogy code {
  background:rgba(0,0,0,0.3);
  padding:1px 6px; border-radius:4px;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:rgba(255,200,150,0.95);
}

#explanation .memo {
  margin-top:12px; padding:10px 14px;
  background:rgba(120,160,255,0.06);
  border-left:3px solid rgba(120,160,255,0.5);
  border-radius:6px;
  font-size:12px;
  color:rgba(180,200,235,0.9);
}
#explanation .memo-label {
  font-size:10px; letter-spacing:1px; text-transform:uppercase;
  color:rgba(120,160,255,0.85); font-weight:700;
  margin-bottom:4px;
}

/* ── NEXT BUTTON ── */
#next-zone {
  display:none;
  position:fixed; bottom:0; left:0; right:0;
  padding:16px 20px;
  background:linear-gradient(transparent,rgba(12,15,26,0.95) 30%);
}
#btn-next {
  width:100%; padding:16px; border-radius:14px;
  border:none;
  background:linear-gradient(135deg,var(--accent),#7c5cf5);
  color:white; font-size:15px; font-weight:600;
  cursor:pointer; font-family:'DM Sans',sans-serif;
  letter-spacing:0.3px;
  transition:transform 0.1s;
}
#btn-next:active { transform:scale(0.97); }

/* ── RESULTS SCREEN ── */
#results-screen {
  display:none; min-height:100vh;
  padding:50px 20px;
  text-align:center;
}
.results-circle {
  width:140px; height:140px; border-radius:50%;
  margin:0 auto 24px;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  font-family:'JetBrains Mono',monospace;
}
.results-pct { font-size:38px; font-weight:700; }
.results-label { font-size:11px; letter-spacing:1px; text-transform:uppercase; margin-top:2px; }
.results-title { font-size:22px; font-weight:700; margin-bottom:8px; }
.results-sub { font-size:14px; color:var(--text-dim); line-height:1.6; margin-bottom:30px; }
.results-details {
  display:flex; gap:24px; justify-content:center;
  margin-bottom:30px;
  font-family:'JetBrains Mono',monospace; font-size:14px;
}
.results-btn-row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.results-btn {
  padding:12px 24px; border-radius:12px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text); font-size:13px;
  cursor:pointer; font-family:'DM Sans',sans-serif;
}

/* ── RESPONSIVE ── */
@media (min-width:600px) {
  #start-screen { padding:60px 20px; }
  #tag-grid { grid-template-columns:repeat(3,1fr); max-width:480px; }
  #quiz-screen { max-width:600px; margin:0 auto; }
  .btn-row { max-width:480px; }
}
</style>
</head>
<body>

<!-- HEADER (visible during quiz) -->
<div id="header" style="display:none">
  <div id="header-left">
    <h1>QCM TSSR</h1>
  </div>
  <div id="score-badge">
    <div class="score-item"><div class="score-dot green"></div><span id="score-correct">0</span></div>
    <div class="score-item"><div class="score-dot red"></div><span id="score-wrong">0</span></div>
  </div>
</div>
<div id="progress-bar" style="display:none"><div id="progress-fill"></div></div>

<!-- START SCREEN -->
<div id="start-screen">
  <div class="logo-qcm">🎓</div>
  <div class="start-title">QCM TSSR<br>Examen Juillet</div>
  <div class="start-sub">
    242 questions · 20 thèmes<br>
    Choix multiples · Score en temps réel<br>
    Sélectionne les thèmes à réviser
  </div>

  <div class="tag-section-title">Thèmes</div>
  <div id="tag-grid"></div>

  <div class="btn-row">
    <button class="btn-all" onclick="selectAll()">Tout</button>
    <button class="btn-main" onclick="startQuiz()">Lancer le QCM</button>
    <button class="btn-all" onclick="selectNone()">Aucun</button>
  </div>

  <div class="start-stats">
    <div>Sélection : <span id="selected-count">0</span> questions</div>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div id="quiz-screen">
  <div id="question-card">
    <div id="question-tag"></div>
    <div id="question-number"></div>
    <div id="question-text"></div>
  </div>
  <div id="choices"></div>
  <div id="explanation"></div>
</div>

<div id="next-zone">
  <button id="btn-next" onclick="nextQuestion()">Question suivante →</button>
</div>

<!-- RESULTS SCREEN -->
<div id="results-screen">
  <div class="results-circle" id="results-circle">
    <div class="results-pct" id="results-pct">0%</div>
    <div class="results-label">Score</div>
  </div>
  <div class="results-title" id="results-title">Résultats</div>
  <div class="results-sub" id="results-sub"></div>
  <div class="results-details">
    <div><span style="color:var(--green)">✓</span> <span id="final-correct">0</span> bonnes</div>
    <div><span style="color:var(--red)">✗</span> <span id="final-wrong">0</span> erreurs</div>
  </div>
  <div class="results-btn-row">
    <button class="results-btn" onclick="retryWrong()">🔄 Refaire les erreurs</button>
    <button class="results-btn" onclick="backToStart()">← Retour au menu</button>
    <button class="results-btn" onclick="startQuiz()">🔀 Nouveau quiz</button>
  </div>
</div>

<script>

/* ═══════════════════════════════════════════
   MÉMOS — Astuces mémorielles pour concepts clés
   ═══════════════════════════════════════════ */
const MEMOS = {
  "Combien de couches possède le modèle OSI ?": "Pour mémoriser l'ordre, retiens : <b>Pour Le Réseau, Tout S'Passe Par Application</b> (Physique, Liaison, Réseau, Transport, Session, Présentation, Application).",
  "Quelle est la couche 1 du modèle OSI ?": "Couche 1 = ce qu'on touche physiquement (les câbles).",
  "Quelle est la couche 2 du modèle OSI ?": "Couche 2 = adresses MAC. Pense aux switches qui mémorisent les MAC.",
  "Quelle est la couche 3 du modèle OSI ?": "Couche 3 = adresses IP. Les routeurs y travaillent.",
  "Quelle est la couche 4 du modèle OSI ?": "Couche 4 = TCP/UDP. Pense 'ports'.",
  "Quelle est la couche 7 du modèle OSI ?": "Couche 7 = ce que voit l'utilisateur (HTTP, mail, etc).",
  "Quelle est la différence entre TCP et UDP ?": "TCP = <b>T</b>rès <b>C</b>ontrôlé et <b>P</b>récis. UDP = <b>U</b>ltra <b>D</b>irect <b>P</b>rio.",
  "Quel port utilise DNS ?": "53 = nombre de cartes dans un jeu (DNS gère les 'cartes' des noms).",
  "Quel port utilise HTTP ?": "80 = pas sécurisé. HTTPS = 443 = sécurisé.",
  "Quel port utilise HTTPS ?": "443 = HTTPS. Astuce : 4+4+3 = 11, comme '11 verrous' sur ta porte sécurisée.",
  "Quel port utilise SSH ?": "22 comme 2 jumeaux qui se parlent en secret (chiffré).",
  "Quel port utilise SMTP ?": "25 = SMTP envoie. Mnémo : 'S<b>e</b>nd Mail à 25'.",
  "Quel port utilise RDP ?": "3389 = RDP. Astuce : '3 + 389' (LDAP) car RDP utilise souvent l'AD.",
  "Quel port utilise Kerberos ?": "88 = Kerberos. Pense 'infinity' (∞ = 8) car Kerberos donne un accès 'illimité' une fois authentifié.",
  "Quel port utilise LDAP ?": "389 = LDAP. LDAPS sécurisé = 636.",
  "Que signifie ITIL ?": "ITIL = <b>I</b>nformation <b>T</b>echnology <b>I</b>nfrastructure <b>L</b>ibrary. Le 'L' pour Library = bibliothèque de bonnes pratiques.",
  "Quels sont les 3 niveaux de support ?": "N1 = simple, N2 = avancé, N3 = expert. Plus le numéro est haut, plus c'est complexe.",
  "Qu'est-ce qu'une GPO ?": "GPO = <b>G</b>roup <b>P</b>olicy <b>O</b>bject. 'Group' car ça s'applique à un groupe d'utilisateurs/postes.",
  "Que contient un bail DHCP ?": "Mémorise IMPD : <b>I</b>P, <b>M</b>asque, <b>P</b>asserelle, <b>D</b>NS.",
  "Que signifient les droits 755 ?": "7 = rwx (4+2+1) = lecture+écriture+exécution. 5 = r-x (4+1). Dans 755 : propriétaire tout, autres lecture+exécution.",
  "Combien d'hôtes dans un réseau /24 ?": "/24 = 8 bits hôtes = 2^8 - 2 = 254 hôtes (on enlève réseau et broadcast).",
  "Combien d'hôtes dans un réseau /25 ?": "/25 = 7 bits hôtes = 2^7 - 2 = 126 hôtes.",
  "Combien d'hôtes dans un réseau /26 ?": "/26 = 6 bits hôtes = 2^6 - 2 = 62 hôtes.",
  "Combien d'hôtes dans un réseau /27 ?": "/27 = 5 bits hôtes = 2^5 - 2 = 30 hôtes.",
  "Combien d'hôtes dans un réseau /28 ?": "/28 = 4 bits hôtes = 2^4 - 2 = 14 hôtes.",
  "Combien d'hôtes dans un réseau /30 ?": "/30 = 2 bits hôtes = 2^2 - 2 = 2 hôtes. Très utilisé pour les liens entre routeurs.",
  "Quelles sont les plages d'adresses IP privées ?": "Astuce : 10 / 172.16 / 192.168. Le '10' c'est facile, '172.16' contient un 16, '192.168' on l'utilise tous chez nous.",
  "Qu'est-ce que le NAT ?": "NAT = <b>N</b>etwork <b>A</b>ddress <b>T</b>ranslation. Comme un traducteur entre deux langues (réseaux).",
  "Qu'est-ce qu'un VLAN ?": "VLAN = <b>V</b>irtual <b>LAN</b>. Plusieurs réseaux dans un seul câble physique.",
  "Quelle est la règle de sauvegarde 3-2-1 ?": "3 copies / 2 supports / 1 hors site. Triangle de protection : 3 copies + 2 supports + 1 distant.",
  "Quels sont les 3 types de sauvegarde ?": "<b>C</b>omplète / <b>D</b>ifférentielle / <b>I</b>ncrémentale. Mnémo CDI (comme contrat).",
  "Qu'est-ce que le RTO ?": "RTO = <b>T</b>ime = TEMPS de récupération. Combien de temps avant de revenir à la normale.",
  "Qu'est-ce que le RPO ?": "RPO = <b>P</b>oint = POINT dans le temps. Combien de données on accepte de perdre.",
  "Quelle différence entre PRA et PCA ?": "PRA = REPRISE (après coupure). PCA = CONTINUITÉ (pas de coupure). PCA est plus exigeant.",
  "Qu'est-ce que le RAID 1 ?": "RAID 1 = miroir. Pense '1 jumeau' qui copie tout.",
  "Qu'est-ce que le RAID 5 ?": "RAID 5 = parité distribuée sur 3+ disques. Tolère 1 panne.",
  "Qu'est-ce que le RAID 6 ?": "RAID 6 = comme RAID 5 mais double parité. Tolère 2 pannes.",
  "Qu'est-ce que le RAID 10 ?": "RAID 10 = miroir (1) + striping (0). Combine sécurité et vitesse.",
  "Qu'est-ce que PXE ?": "PXE = <b>P</b>reboot e<b>X</b>ecution <b>E</b>nvironment. Démarrage par le réseau, sans disque local.",
  "Qu'est-ce que MDT ?": "MDT = <b>M</b>icrosoft <b>D</b>eployment <b>T</b>oolkit. Boîte à outils pour automatiser les déploiements.",
  "Qu'est-ce que WSUS ?": "WSUS = <b>W</b>indows <b>S</b>erver <b>U</b>pdate <b>S</b>ervices. Centralise les patchs Windows.",
  "Qu'est-ce que le MFA ?": "MFA = <b>M</b>ulti-<b>F</b>actor <b>A</b>uthentication. Mot de passe + téléphone = 2 facteurs.",
  "Quelle différence entre IDS et IPS ?": "IDS = <b>D</b>etection (alerte). IPS = <b>P</b>revention (bloque). IPS = IDS + action.",
  "Qu'est-ce qu'un proxy ?": "Proxy = mandataire. Il fait les requêtes web à ta place.",
  "Qu'est-ce qu'une DMZ ?": "DMZ = zone tampon. Comme une cour avant un château fort.",
  "Quelle est la différence entre POP3 et IMAP ?": "POP3 = télécharge (PoP comme 'pop' = enlever). IMAP = synchronise (Internet Message Access Protocol).",
  "Qu'est-ce que SNMP ?": "SNMP = <b>S</b>imple <b>N</b>etwork <b>M</b>anagement <b>P</b>rotocol. Pour superviser les équipements.",
  "Qu'est-ce que la VoIP ?": "VoIP = <b>V</b>oice <b>o</b>ver <b>IP</b>. La voix passe par le réseau IP au lieu du téléphone classique.",
  "Qu'est-ce que le protocole SIP ?": "SIP = <b>S</b>ession <b>I</b>nitiation <b>P</b>rotocol. Initie les appels VoIP. Port 5060.",
  "Qu'est-ce qu'un IPBX ?": "IPBX = <b>IP</b> <b>P</b>rivate <b>B</b>ranch e<b>X</b>change. Le standard téléphonique en IP.",
  "Qu'est-ce que le phishing ?": "Phishing = pêche en anglais. L'attaquant 'pêche' tes informations avec un appât (faux email).",
  "Qu'est-ce qu'une attaque DDoS ?": "DDoS = <b>D</b>istributed <b>D</b>enial <b>o</b>f <b>S</b>ervice. Beaucoup de machines attaquent en même temps.",
  "Quelle différence entre Cat5e et Cat6 ?": "Cat5e = 1 Gbit/s. Cat6 = jusqu'à 10 Gbit/s sur 55m. Plus le numéro est haut, plus c'est rapide.",
  "Quelle différence entre fibre monomode et multimode ?": "Mono = 1 mode = un seul rayon = longue distance. Multi = plusieurs rayons = courte distance.",
};

const EXPLANATIONS = {
  "Cite 3 logiciels de supervision": "Les principaux : Nagios (libre, historique), Zabbix (libre, complet), Centreon (libre, basé sur Nagios, interface web moderne — très utilisé en France), PRTG (propriétaire Allemand, freemium), Grafana (visualisation, souvent couplé avec Prometheus pour les métriques). Citer 2-3 outils + Centreon est très valorisé à l'examen.",
  "Cite un logiciel IPBX libre": "Asterisk (#1 libre, créé en 1999, très puissant et flexible). Variantes plus user-friendly : FreePBX (interface web sur Asterisk), Issabel (anciennement Elastix). Alternative en version gratuite limitée : 3CX. Asterisk est utilisé dans des dizaines de milliers d'entreprises dans le monde, y compris des grandes.",
  "Combien d'hôtes dans un réseau /16 ?": "/16 = 16 bits hôtes = 2^16 = 65 536, moins 2 (réseau et broadcast) = 65 534 hôtes. Énorme, utilisé sur des réseaux privés massifs (ex: 10.0.0.0/16). Risque : trop de broadcast, on segmente avec des VLAN. Classe B classique.",
  "Combien d'hôtes dans un réseau /24 ?": "/24 = 8 bits hôtes restants = 2^8 = 256 adresses, mais on retire 2 (l'adresse réseau .0 et le broadcast .255) = 254 hôtes utilisables. C'est le masque le plus courant en LAN d'entreprise. Mémoriser cette formule (2^n - 2) est ESSENTIEL pour le TSSR.",
  "Combien d'hôtes dans un réseau /25 ?": "/25 = 7 bits hôtes = 2^7 = 128 adresses, moins 2 (réseau et broadcast) = 126 hôtes utilisables. Masque associé : 255.255.255.128. Découpe d'un /24 en 2 sous-réseaux de 126 hôtes chacun. Cas typique : segmenter un réseau d'entreprise.",
  "Combien d'hôtes dans un réseau /26 ?": "/26 = 6 bits hôtes = 2^6 = 64 adresses, moins 2 = 62 hôtes utilisables. Masque : 255.255.255.192. Découpe d'un /24 en 4 sous-réseaux de 62 hôtes. Pratique pour des bureaux ou départements de taille moyenne.",
  "Combien d'hôtes dans un réseau /27 ?": "/27 = 5 bits hôtes = 2^5 = 32 adresses, moins 2 = 30 hôtes utilisables. Masque : 255.255.255.224. Découpe d'un /24 en 8 sous-réseaux de 30 hôtes. Utile pour les petites équipes ou DMZ.",
  "Combien d'hôtes dans un réseau /28 ?": "/28 = 4 bits hôtes = 2^4 = 16 adresses, moins 2 = 14 hôtes utilisables. Masque : 255.255.255.240. Bon pour des petits sous-réseaux dédiés (DMZ, lien dédié, petite équipe).",
  "Combien d'hôtes dans un réseau /30 ?": "/30 = 2 bits hôtes = 2^2 = 4 adresses, moins 2 = 2 hôtes utilisables. Masque : 255.255.255.252. UTILISATION TYPIQUE : liens point-à-point entre routeurs (juste 2 IP nécessaires). Économise drastiquement les adresses IP.",
  "Combien de couches possède le modèle OSI ?": "Le modèle OSI (Open Systems Interconnection) est un cadre théorique standardisé par l'ISO en 1984 qui décompose les communications réseau en 7 couches indépendantes. Chaque couche a une fonction précise et communique avec sa voisine, ce qui permet l'interopérabilité entre constructeurs. C'est le concept fondamental qu'un TSSR doit maîtriser pour diagnostiquer un problème (réseau ? câble ? application ?).",
  "Comment changer le propriétaire d'un fichier ?": "chown utilisateur:groupe fichier (change owner). Ex : chown www-data:www-data /var/www/site (pour qu'Apache puisse lire). Doit être exécuté en root (sudo). Récursif avec -R : chown -R user:group dossier/. Couplé avec chmod, c'est la base de la sécurité Linux.",
  "Comment changer les droits d'un fichier sous Linux ?": "chmod (change mode) permet de modifier les droits. Notation octale : chmod 755 fichier.sh (rwx pour propriétaire, r-x pour groupe et autres). Notation symbolique : chmod u+x fichier (ajouter exécution au propriétaire). Le 'x' est indispensable pour exécuter un script.",
  "Comment créer un utilisateur AD en PowerShell ?": "New-ADUser -Name \"Jean\" -SamAccountName \"jean\" -Enabled $true. Module requis : Active Directory (présent sur les DC ou via RSAT). Permet d'automatiser la création de comptes en masse depuis un CSV. Préférable à la GUI Active Directory Users & Computers pour les opérations répétitives.",
  "Comment dit-on \"chiffrement\" en anglais ?": "Encryption. Verbe : to encrypt. Inverse : decryption / to decrypt. Attention : ne pas confondre avec 'cryptage' qui n'existe pas en français normatif (préférer chiffrement). End-to-end encryption = chiffrement de bout en bout.",
  "Comment dit-on \"commutateur\" en anglais ?": "Switch. Le mot anglais s'est imposé en français aussi — on dit rarement 'commutateur' au quotidien. Switch travaille en couche 2 (MAC). Dérivé : 'switching' = commutation.",
  "Comment dit-on \"dépanner\" en anglais ?": "To troubleshoot. 'Trouble' = problème + 'shoot' = tirer. Littéralement : 'tirer sur le problème'. Dérivés : troubleshooting (le dépannage), troubleshooter (l'outil ou la personne qui dépanne).",
  "Comment dit-on \"déploiement\" en anglais ?": "Deployment. Verbe : to deploy. Très utilisé dans le contexte IT : software deployment, OS deployment, deployment pipeline. Le terme évoque l'idée de 'déplier' une solution sur plusieurs machines.",
  "Comment dit-on \"journaux d'événements\" en anglais ?": "Event logs. 'Logs' (au pluriel) = journaux d'événements en informatique. To log = enregistrer dans un journal. Logging = action de journaliser. À ne pas confondre avec 'login' (connexion).",
  "Comment dit-on \"mise à jour\" en anglais ?": "Update (mineure, correctifs) ≠ Upgrade (majeure, nouvelle version). Update Windows 11 22H2 → 23H2 = upgrade. Patch Tuesday = update. Bien faire la distinction au boulot, surtout pour planifier les downtimes.",
  "Comment dit-on \"mot de passe\" en anglais ?": "Password. Mot de passe au sens littéral. Dérivés à connaître : password policy (politique de MdP), password reset (réinitialisation), password manager (gestionnaire), strong password (mot de passe fort).",
  "Comment dit-on \"pare-feu\" en anglais ?": "Firewall, littéralement 'mur de feu' (fire = feu, wall = mur). Le terme français 'pare-feu' est une traduction directe. Dans toute la doc technique, tu rencontreras toujours 'firewall' : Windows Firewall, firewall rules, firewall policy.",
  "Comment dit-on \"restauration\" en anglais ?": "Restore. Verbe et nom. Restoration existe aussi mais 'restore' est le terme technique standard : restore from backup, point-in-time restore, bare-metal restore. Souvent associé à 'recovery'.",
  "Comment dit-on \"routeur\" en anglais ?": "Router. La prononciation anglaise est 'roo-ter' (US) ou 'rao-ter' (UK). Dérivés : routing (routage), routed protocol, default route. Travaille en couche 3 (IP).",
  "Comment dit-on \"réseau\" en anglais ?": "Network. Mot incontournable : tu le verras partout dans la doc IT. Astuce : 'work' (travail) + 'net' (filet) = travail en filet, en équipe d'éléments interconnectés. Dérivés : networking, networked, subnet (sous-réseau).",
  "Comment dit-on \"sauvegarde\" en anglais ?": "Backup (un seul mot). 'Back up' (deux mots) = verbe (faire la sauvegarde). 'Backup' (un mot) = nom (la sauvegarde). 'Restore' = restaurer. Dérivés : full backup, incremental backup, backup policy.",
  "Comment dit-on \"serveur\" en anglais ?": "Server. Verbe associé : to serve. File server, web server, mail server, database server. Le suffixe -er indique 'celui qui fait l'action' : ce qui sert.",
  "Comment dit-on \"surveiller\" en anglais ?": "To monitor. Verbe et le sujet 'monitor' = écran (un autre sens). Monitoring = la surveillance. Network monitoring, performance monitoring, monitoring tools (Nagios, Zabbix...).",
  "Comment installer un paquet sous Debian/Ubuntu ?": "sudo apt install nom_du_paquet (anciennement apt-get install). Toujours faire sudo apt update AVANT pour rafraîchir l'index des paquets. Sur RedHat/CentOS/Rocky : dnf install ou yum install. Sur Arch : pacman -S. Connaître ces 3 gestionnaires est attendu d'un TSSR.",
  "Comment lister les fichiers en PowerShell ?": "Get-ChildItem (alias : ls, dir, gci). Renvoie des objets, pas du texte → tu peux directement faire Get-ChildItem | Where-Object {$_.Length -gt 1MB} pour filtrer les gros fichiers. C'est ça la puissance de PowerShell : les pipes manipulent des objets typés.",
  "Comment monter un partage SMB/CIFS sous Linux ?": "mount -t cifs //serveur/partage /mnt/point -o username=user,password=pwd. Pour persistance, ajouter dans /etc/fstab. Préférer les credentials dans un fichier protégé (-o credentials=/etc/cifs.cred). Paquet requis : cifs-utils. Très utile pour accéder aux serveurs Windows depuis Linux.",
  "Comment planifier une tâche sous Windows (CLI) ?": "schtasks /create /tn \"NomTache\" /tr \"commande\" /sc daily /st 08:00. Permet de scripter la création de tâches sans passer par la GUI. Très utile dans les scripts de déploiement de masse. Alternative moderne et plus puissante : New-ScheduledTask en PowerShell.",
  "Comment planifier une tâche sous Windows (GUI) ?": "Le Planificateur de tâches : taskschd.msc (ou Outils d'administration > Planificateur de tâches). Permet de créer des tâches déclenchées par : heure, événement, démarrage, login, etc. Plus puissant que cron sur certains aspects (déclencheurs événementiels). Utilisé pour scripts admin, sauvegardes, maintenance.",
  "Comment redémarrer un serveur à distance en PowerShell ?": "Restart-Computer -ComputerName \"NomServeur\" -Force. Pré-requis : WinRM activé sur la cible (Enable-PSRemoting), droits admin, firewall qui laisse passer. -Force ferme les sessions ouvertes. Très utile en script pour redémarrer plusieurs serveurs après un patch Tuesday.",
  "Comment redémarrer un service sous Linux (systemd) ?": "sudo systemctl restart nom_du_service (ex: sudo systemctl restart apache2). systemd est l'init system standard sur Debian/Ubuntu/CentOS modernes. Autres commandes : start, stop, status, enable (au boot), disable. Anciens systèmes : service nom_du_service restart.",
  "Comment rendre un script exécutable sous Linux ?": "chmod +x script.sh ajoute le droit d'exécution. Sans ça, tu auras 'Permission denied'. Pour l'exécuter ensuite : ./script.sh (le ./ indique le répertoire courant). Astuce : utiliser chmod 755 script.sh pour donner exécution à tout le monde proprement.",
  "Comment tuer un processus par son PID ?": "kill PID envoie le signal SIGTERM (15) qui demande gentiment l'arrêt. Si ça ne suffit pas : kill -9 PID envoie SIGKILL qui tue immédiatement (mais peut laisser des fichiers corrompus). Astuce : pkill nom_processus (par nom au lieu de PID).",
  "Comment vider le cache DNS sous Windows ?": "ipconfig /flushdns vide le cache DNS local (Windows met en cache les résolutions pour aller plus vite). Utile quand un serveur a changé d'IP et que ton PC répond avec l'ancienne. Sur Linux moderne : sudo systemd-resolve --flush-caches ou redémarrer nscd/dnsmasq selon la distro.",
  "Comment voir les logs en temps réel sous Linux ?": "tail -f /var/log/syslog (suivre l'écriture en direct). Pour les services systemd modernes : journalctl -fu nom_service. Idéal pour observer ce qui se passe pendant un test ou diagnostiquer un problème en direct. Ctrl+C pour quitter.",
  "Comment vérifier la connectivité réseau en PowerShell ?": "Test-NetConnection -ComputerName google.com -Port 443. Plus puissant que ping car teste un PORT précis (pas juste ICMP) — utile quand un firewall bloque ICMP mais laisse HTTPS. Renvoie un objet avec TcpTestSucceeded, latence, etc. À mémoriser ABSOLUMENT.",
  "Comment vérifier le statut d'un service ?": "sudo systemctl status nom_du_service affiche : état (active/inactive/failed), PID, dernières lignes de logs. Indispensable pour diagnostiquer un service qui ne démarre pas. Pour voir les logs complets : journalctl -u nom_du_service.",
  "Comment écrire une boucle for en Bash ?": "Syntaxe : for i in 1 2 3; do echo $i; done. La structure est for VAR in LISTE; do COMMANDES; done. Variantes : for f in *.txt (parcourir les fichiers), for i in {1..10} (range), while [ condition ]; do ... done (tant que). Indispensable pour automatiser des actions répétées.",
  "Comment écrire une condition if en Bash ?": "if [ condition ]; then commande; fi. Attention aux ESPACES autour des crochets. Exemples : if [ -f fichier ] (existe ?), if [ \"$x\" = \"oui\" ] (égalité). Avec else : if ...; then ...; else ...; fi. Avec elif : if ...; then ...; elif ...; then ...; else ...; fi.",
  "Où crée-t-on les GPO ?": "Dans la console GPMC (Group Policy Management Console), accessible via gpmc.msc ou Server Manager > Tools > Group Policy Management. C'est un MMC (Microsoft Management Console). Les GPO peuvent être liées à un Site, un Domaine ou une OU, avec un ordre de priorité (LSDOU : Local, Site, Domain, OU).",
  "Qu'est-ce qu'ITIL ?": "ITIL (IT Infrastructure Library) est le référentiel mondial des bonnes pratiques de gestion des services informatiques. Il définit le vocabulaire (incident, problème, changement) et les processus (gestion des incidents, des changements, etc.). Connaître ITIL est un vrai plus pour communiquer avec les équipes IT.",
  "Qu'est-ce qu'un DEEE ?": "Déchet d'Équipement Électrique et Électronique : vieux PC, écrans, imprimantes, smartphones... Ils contiennent des métaux rares ET toxiques. RÉGLEMENTATION OBLIGATOIRE en Europe : ils DOIVENT être collectés via des filières agréées (Ecologic, Ecosystem en France). Pas le droit de les jeter à la poubelle classique. Question de droit, pas juste d'écologie.",
  "Qu'est-ce qu'un EDR ?": "Endpoint Detection and Response : antivirus 'next-gen' qui surveille en permanence le comportement du poste (fichiers, processus, réseau, registre) pour détecter des activités suspectes même inconnues. Plus puissant qu'un antivirus classique. Exemples : CrowdStrike, SentinelOne, Microsoft Defender for Endpoint.",
  "Qu'est-ce qu'un IPBX ?": "IP Private Branch eXchange : autocommutateur téléphonique en IP — l'équivalent moderne du PABX. Gère les appels internes/externes, transferts, files d'attente, messagerie vocale, conférences. Solutions : Asterisk (libre, le plus populaire), 3CX, FreePBX (basé sur Asterisk), Cisco CallManager. Au coeur de la téléphonie moderne d'entreprise.",
  "Qu'est-ce qu'un MDM ?": "Mobile Device Management : solution pour gérer à distance les smartphones, tablettes, parfois PC. Permet : configuration auto, déploiement d'apps, sécurisation (chiffrement, code PIN forcé), effacement à distance en cas de vol. Solutions : Microsoft Intune, VMware Workspace ONE, MobileIron. Critique pour la sécurité BYOD.",
  "Qu'est-ce qu'un OID en SNMP ?": "Object IDentifier : identifiant unique d'une métrique en SNMP, sous forme arborescente (ex: 1.3.6.1.2.1.1.5.0 = nom de l'équipement). Comme un chemin de fichier mais pour des données. Les MIB (Management Information Base) sont des fichiers qui décrivent ces OID en termes lisibles. Tu fais un 'snmpget' avec un OID pour récupérer une valeur.",
  "Qu'est-ce qu'un PCA ?": "Plan de Continuité d'Activité : MAINTENIR l'activité PENDANT le sinistre, sans interruption (ou très courte). Beaucoup plus exigeant et coûteux que le PRA. Implique : sites de secours actifs, réplication continue, basculement automatique. Pour les services critiques (banque, hôpital, e-commerce).",
  "Qu'est-ce qu'un PRA ?": "Plan de Reprise d'Activité : ensemble de procédures pour REPRENDRE l'activité après un sinistre majeur (incendie, inondation, ransomware). On accepte une COUPURE temporaire (RTO de plusieurs heures à plusieurs jours). Documentation détaillée : qui contacter, comment restaurer, où. Doit être TESTÉ régulièrement (sinon c'est juste du papier).",
  "Qu'est-ce qu'un SI ?": "SI = Système d'Information : tout l'écosystème informatique d'une organisation (matériel, logiciels, données, réseaux, utilisateurs, procédures). En tant que TSSR, tu en es un des piliers techniques. Comprendre le SI dans sa globalité aide à prioriser les incidents (un serveur de paye en panne = bien plus critique qu'un poste).",
  "Qu'est-ce qu'un SLA ?": "SLA (Service Level Agreement) = contrat qui engage le prestataire sur des délais : par exemple 'panne critique = intervention en 4h, résolution en 8h'. C'est la base de la relation client/prestataire. Souvent assorti de pénalités si non respecté. À distinguer du SLO (objectif interne) et SLI (indicateur mesuré).",
  "Qu'est-ce qu'un VLAN ?": "Virtual LAN : segmentation logique d'un réseau physique. Plusieurs VLAN sur un même switch = plusieurs réseaux étanches. Avantages : sécurité (les services RH ne voient pas le commercial), réduction du broadcast, organisation logique sans recâbler. Standard 802.1Q. Indispensable en entreprise dès quelques dizaines de postes.",
  "Qu'est-ce qu'un VPN ?": "Virtual Private Network : tunnel chiffré qui traverse un réseau public (Internet) en simulant une connexion privée. Confidentialité (chiffrement) + intégrité (pas modifié) + authentification. Protocoles : IPsec, OpenVPN, WireGuard (moderne), L2TP/IPsec, SSTP. Utilisé par 99% des télétravailleurs.",
  "Qu'est-ce qu'un alias de messagerie ?": "Adresse email SUPPLÉMENTAIRE qui redirige vers la boîte principale. Exemple : contact@societe.com et info@societe.com pointent vers admin@societe.com. Permet de regrouper, de protéger l'adresse réelle, de créer des adresses fonctionnelles. Différent d'une boîte mail dédiée (qui a son propre stockage).",
  "Qu'est-ce qu'un certificat SSL/TLS ?": "Document numérique qui : 1) authentifie l'identité d'un site (signé par une autorité de confiance comme Let's Encrypt, DigiCert), 2) contient la clé publique pour démarrer le chiffrement TLS. C'est lui qui produit le cadenas dans le navigateur. Toujours vérifier la validité, le nom, l'autorité émettrice. Free aujourd'hui via Let's Encrypt.",
  "Qu'est-ce qu'un cluster ?": "Groupe de serveurs qui collaborent comme une seule entité logique. Deux objectifs principaux : HA (si un nœud tombe, un autre prend le relais sans interruption) ou répartition de charge (load balancing). Exemples : cluster Hyper-V, cluster Failover Windows, Kubernetes (cluster de conteneurs).",
  "Qu'est-ce qu'un conteneur (Docker) ?": "Application packagée avec ses dépendances dans un format léger qui partage le noyau de l'OS hôte. Beaucoup plus léger qu'une VM (pas de noyau dédié) : démarre en secondes, consomme peu de RAM. Standard de fait : Docker. Orchestration : Kubernetes. Idéal pour les microservices et la CI/CD.",
  "Qu'est-ce qu'un contrôleur de domaine (DC) ?": "Un DC est un serveur Windows qui héberge l'AD et authentifie les utilisateurs/machines du domaine. Bonne pratique : toujours au moins 2 DC pour la redondance (en cas de panne, l'autre prend le relais). On promeut un serveur en DC via Server Manager > Add Roles > AD DS, puis dcpromo (ancien) ou Promote this server.",
  "Qu'est-ce qu'un câble RJ45 ?": "Connecteur standard pour câbles réseau Ethernet : 8 broches, format rectangulaire avec un clip. Catégories : Cat5e (1 Gbit/s), Cat6 (10 Gbit/s sur 55m), Cat6a (10 Gbit/s sur 100m), Cat7/Cat8 (au-delà). Le sertissage se fait avec une pince à sertir et suit un code couleur (T568A ou T568B).",
  "Qu'est-ce qu'un câble droit vs croisé ?": "DROIT : pour relier 2 équipements DIFFÉRENTS (PC ↔ switch, switch ↔ routeur). C'est le câble standard. CROISÉ : pour relier 2 équipements IDENTIQUES (PC ↔ PC, switch ↔ switch sur ports non auto-MDIX). Aujourd'hui devenu rare car les ports modernes sont 'auto-MDIX' (détection automatique). Mais à connaître pour le TSSR.",
  "Qu'est-ce qu'un enregistrement MX ?": "Enregistrement DNS qui indique QUEL serveur gère les emails pour un domaine. MX = Mail eXchanger. Quand un mail est envoyé à user@domaine.fr, le serveur source interroge le DNS pour le MX du domaine.fr et envoie le mail à ce serveur. On peut avoir plusieurs MX avec des priorités (le plus bas = prioritaire).",
  "Qu'est-ce qu'un fichier de réponses (Unattend.xml) ?": "Fichier XML qui automatise les réponses aux questions pendant l'installation Windows : nom de la machine, mot de passe admin, langue, partitionnement, jonction au domaine, etc. Évite l'intervention manuelle pendant le setup. Généré avec Windows System Image Manager (WSIM). Au cœur du déploiement automatisé.",
  "Qu'est-ce qu'un firewall (pare-feu) ?": "Dispositif (matériel ou logiciel) qui filtre le trafic réseau entrant et sortant selon des règles. Travaille principalement en couches 3 et 4 (IP et ports). Premier rempart contre les intrusions. Tous les OS modernes en intègrent un (Windows Firewall, iptables/firewalld sous Linux). En entreprise : équipements dédiés (Stormshield, Fortinet, Sophos, pfSense).",
  "Qu'est-ce qu'un handshake TCP en 3 temps ?": "Pour établir une connexion fiable, TCP fait 3 échanges : SYN (client demande à se connecter), SYN-ACK (serveur accepte et confirme), ACK (client confirme). C'est seulement après ces 3 messages que les données peuvent circuler. Beaucoup d'attaques (SYN flood) exploitent cette mécanique.",
  "Qu'est-ce qu'un hyperviseur ?": "Logiciel qui crée et gère des VM (Virtual Machines) sur un serveur physique. Il distribue les ressources (CPU, RAM, disque, réseau) entre les VMs. Sans hyperviseur, pas de virtualisation. Permet de mutualiser des dizaines de VMs sur un seul serveur physique → économie énorme en datacenter.",
  "Qu'est-ce qu'un masque de sous-réseau ?": "Le masque sépare la partie réseau (les bits à 1 du masque) de la partie hôte (les bits à 0). Ex : 255.255.255.0 = /24 = 24 bits réseau + 8 bits hôte = 254 hôtes possibles. Sans masque, impossible de savoir si une IP est dans MON réseau ou un autre — donc impossible de router.",
  "Qu'est-ce qu'un panneau de brassage (patch panel) ?": "Panneau passif avec des ports RJ45 montés en rack qui centralise les arrivées des câbles muraux. On 'brassse' (avec des cordons RJ45 courts) le port mural au switch correspondant. Avantages : organisation, modularité (changer un brassage sans recâbler), protection des câbles longs. Standard en câblage structuré.",
  "Qu'est-ce qu'un profil itinérant ?": "Roaming Profile : profil utilisateur (bureau, documents, configs) stocké sur un serveur central et synchronisé à chaque ouverture/fermeture de session. L'utilisateur retrouve son environnement depuis n'importe quel poste du domaine. Peut être lent au login si le profil est gros — l'alternative moderne est Folder Redirection + UE-V/FSLogix.",
  "Qu'est-ce qu'un proxy ?": "Serveur intermédiaire qui relaie les requêtes web. Côté client (proxy direct) : cache l'IP des utilisateurs, filtre les sites, met en cache pour économiser la bande passante. Côté serveur (reverse proxy : Nginx, HAProxy) : protège les serveurs derrière, répartit la charge, gère le SSL. Standard en entreprise.",
  "Qu'est-ce qu'un relais SMTP ?": "Serveur SMTP qui RECOIT les mails et les TRANSMET vers leur destination (autre serveur SMTP). Utilisé par : applications qui doivent envoyer des notifications (sans avoir leur propre serveur), imprimantes multifonctions, scanners-vers-mail. Toujours sécuriser les relais (sinon spam open relay → blacklisté en quelques heures).",
  "Qu'est-ce qu'un script Bash ?": "Programme texte qui automatise des tâches sous Linux. Première ligne (shebang) : #!/bin/bash indique au système quel interpréteur utiliser. Extension habituelle : .sh. Permet d'enchaîner des commandes, faire des conditions, des boucles. Outil quotidien de l'admin Linux pour automatiser sauvegardes, déploiements, contrôles.",
  "Qu'est-ce qu'un script PowerShell ?": "Le langage de script Microsoft moderne (extension .ps1), basé sur le framework .NET donc orienté OBJET (pas juste du texte comme Bash). Les commandes s'appellent des cmdlets : Get-Process, Set-Service, etc. Très puissant pour administrer Windows et Active Directory. Présent par défaut sur Windows depuis Win7.",
  "Qu'est-ce qu'un serveur LAMP ?": "L = Linux (OS), A = Apache (serveur web), M = MySQL/MariaDB (base de données), P = PHP (langage). Pile open-source historique qui héberge la majorité des sites web. Variante WAMP (Windows), MAMP (Mac), LEMP (Nginx au lieu d'Apache). Toujours d'actualité même si concurrencé par Node.js et Python.",
  "Qu'est-ce qu'un seuil d'alerte ?": "Valeur LIMITE configurée dans l'outil de supervision : au-dessus, une alerte est déclenchée. Exemple : CPU > 80%, disque > 90%, latence > 100ms. Distinction WARNING (à surveiller) vs CRITICAL (à intervenir d'urgence). Bien calibrer les seuils est un ART : trop bas = bruit (alarme fatigue), trop haut = on rate des problèmes.",
  "Qu'est-ce qu'un snapshot ?": "Photo instantanée de l'état d'une VM (mémoire + disque + config) à un moment T. Permet de revenir en arrière en cas de problème. PARFAIT avant une mise à jour risquée. ATTENTION : un snapshot N'EST PAS une sauvegarde — il dépend du fichier disque original. Et plus on accumule, plus ça ralentit la VM.",
  "Qu'est-ce qu'un tableau de bord de supervision ?": "Interface graphique (souvent web) qui présente VISUELLEMENT les indicateurs clés en temps réel : graphiques, jauges, alertes, statuts. Doit être lisible en un coup d'œil (codes couleur vert/orange/rouge). Outils : Grafana (le plus populaire), Centreon, Kibana. Affiché souvent sur un grand écran dans la salle des admins.",
  "Qu'est-ce qu'un ticket d'incident ?": "Un ticket est l'unité de base du support : il trace tout, de la première remontée jusqu'à la résolution. Il contient le demandeur, la date, la description, la priorité, l'historique des actions, et qui a résolu. Outils typiques : GLPI, ServiceNow, Jira. Un bon ticket = un suivi clair et un capital de connaissance pour la suite.",
  "Qu'est-ce qu'un trunk (802.1Q) ?": "Lien entre 2 switches (ou switch ↔ routeur) qui transporte PLUSIEURS VLANs. Chaque trame est étiquetée (tag 802.1Q) avec son numéro de VLAN. Sans trunk, il faudrait un câble par VLAN entre les switches. Configuration côté Cisco : switchport mode trunk.",
  "Qu'est-ce qu'une ACL (Access Control List) ?": "Liste ordonnée de règles 'autoriser/refuser' sur un routeur ou switch. Critères : IP source, IP destination, ports, protocole. Permet de filtrer FINEMENT le trafic entre VLANs ou aux frontières. Cisco standard : 'access-list 10 permit 192.168.1.0 0.0.0.255'. La première règle qui matche s'applique.",
  "Qu'est-ce qu'une DMZ ?": "Zone DéMilitarisée : sous-réseau tampon entre Internet et le réseau interne. On y place les serveurs accessibles depuis Internet (web, mail, DNS public). Si un attaquant compromet un serveur en DMZ, il n'a PAS d'accès direct au LAN interne (un firewall sépare DMZ et LAN). Architecture classique : 3 zones — Internet | DMZ | LAN.",
  "Qu'est-ce qu'une GPO ?": "Group Policy Object = règle de configuration appliquée automatiquement aux utilisateurs/postes du domaine. Exemples : politique de mot de passe, lecteur réseau monté, fond d'écran imposé, désactivation USB, mise à jour Windows forcée. C'est l'outil de standardisation #1 pour piloter des centaines de postes sans intervention manuelle.",
  "Qu'est-ce qu'une OU (Organizational Unit) ?": "Une OU = conteneur logique dans l'AD pour organiser les objets (utilisateurs, groupes, ordinateurs) selon ta structure (par service, site, fonction). Permet d'appliquer des GPO ciblées et de déléguer l'admin (ex: les RH gèrent leur propre OU). C'est le seul conteneur sur lequel on peut appliquer des GPO (les CN par défaut, non).",
  "Qu'est-ce qu'une adresse IP ?": "L'identifiant logique unique d'un appareil sur un réseau (couche 3 du modèle OSI). IPv4 = 32 bits, écrite en 4 octets décimaux (ex: 192.168.1.1). IPv6 = 128 bits (face à la pénurie d'IPv4). C'est l'adresse postale virtuelle de chaque machine — sans IP, pas de communication réseau.",
  "Qu'est-ce qu'une attaque DDoS ?": "Distributed Denial of Service : des milliers de machines (botnet) inondent simultanément le serveur de requêtes pour le saturer. Pas de vol de données, juste indisponibilité. Parades : services anti-DDoS (Cloudflare, OVH), filtrage en amont, bande passante surdimensionnée.",
  "Qu'est-ce qu'une attaque Man-in-the-Middle ?": "L'attaquant s'intercale entre 2 parties (toi ↔ serveur) pour lire ou modifier les échanges. Très efficace sur Wi-Fi public non chiffré. Parades : HTTPS partout (chiffrement de bout en bout), VPN sur réseaux non sûrs, vérifier les certificats, HSTS pour forcer HTTPS.",
  "Qu'est-ce qu'une attaque brute force ?": "Tester systématiquement toutes les combinaisons jusqu'à trouver le bon mot de passe. Les attaquants utilisent des dictionnaires (mots courants) et des accélérateurs (GPU). Parades : verrouillage après N tentatives, mots de passe longs (>12 caractères), MFA obligatoire, fail2ban (Linux) ou Account Lockout Policy (Windows).",
  "Qu'est-ce qu'une baie de brassage ?": "Armoire technique (rack) standardisée (largeur 19 pouces) qui regroupe les équipements réseau : switches, patch panels, routeurs, parfois serveurs. Hauteur en U (1U = 4,4 cm). Permet l'organisation, le refroidissement, l'accès facile. Au coeur de chaque local technique en entreprise.",
  "Qu'est-ce qu'une escalade ?": "Quand le N1 ne peut pas résoudre dans son périmètre/temps imparti, il escalade vers N2 (techniques avancés) puis N3 (experts/éditeur). L'escalade doit être documentée (qu'est-ce qui a été tenté, résultats) pour ne pas faire répéter l'utilisateur. Une bonne escalade = un ticket complet, pas un 'à toi de jouer'.",
  "Qu'est-ce qu'une forêt Active Directory ?": "Le sommet de la hiérarchie AD. Une forêt contient un ou plusieurs domaines qui partagent le même schéma (structure de la base) et catalogue global. Frontière de sécurité ultime : sortir d'une forêt = changer d'identité. Les grandes entreprises ont parfois plusieurs forêts pour isoler des entités.",
  "Qu'est-ce qu'une image master ?": "Image système de référence ('Gold Image') contenant : OS + tous les drivers + tous les logiciels standards de l'entreprise. Utilisée pour cloner des dizaines/centaines de postes identiques. Mise à jour régulièrement (drivers, patchs). Avant capture : on lance Sysprep pour 'généraliser' (supprimer SID et infos uniques).",
  "Qu'est-ce qu'une passerelle par défaut ?": "Default gateway : l'adresse IP du routeur que les postes utilisent pour sortir vers d'autres réseaux. Sur ta box, c'est typiquement 192.168.1.1 ou .254. Sans passerelle, les hôtes ne peuvent communiquer qu'à l'intérieur de leur sous-réseau. C'est LA porte de sortie.",
  "Qu'est-ce qu'une route par défaut ?": "Route 0.0.0.0/0 : si aucune route spécifique ne correspond, tout le trafic est envoyé vers cette destination (typiquement la passerelle Internet). C'est la 'route fourre-tout'. Sur les postes : c'est l'adresse de la box. Sur un routeur : c'est vers le routeur du FAI.",
  "Qu'est-ce qu'une réservation DHCP ?": "Forcer une IP donnée à toujours être attribuée à une machine spécifique en se basant sur son adresse MAC. Utile pour : imprimantes, serveurs, NAS — tout ce qui doit avoir une IP stable mais reste géré par DHCP (plus simple qu'une IP statique manuelle, et tu peux changer la config DNS depuis le serveur).",
  "Qu'est-ce qu'une trap SNMP ?": "Alerte ASYNCHRONE envoyée SPONTANÉMENT par un équipement vers le serveur de supervision (port UDP 162) quand un événement précis se produit (panne d'interface, seuil dépassé, redémarrage). Plus réactif que le polling. Configurer les traps sur les switches/firewalls pour avoir une supervision en temps réel.",
  "Qu'est-ce qu'une tâche Cron ?": "Planificateur de tâches sous Linux. Configuration via crontab -e (édite le crontab de l'utilisateur courant). Format : 5 champs (min heure jour mois jour-semaine) + commande. Logs dans /var/log/syslog ou /var/log/cron selon la distro. Toujours utiliser des chemins absolus dans les commandes !",
  "Qu'est-ce qu'une variable en Bash ?": "Stocke une valeur. Déclaration : NOM=\"valeur\" (PAS d'espace autour du =, sinon erreur !). Utilisation : $NOM ou ${NOM} (la version avec accolades évite les ambiguïtés). Exemple : NOM=Jean ; echo \"Bonjour $NOM\". Variables d'env : export NOM (visible par les sous-processus).",
  "Qu'est-ce qu'une zone DNS de recherche directe ?": "Forward Lookup Zone : nom → IP (le cas standard). Tu tapes www.exemple.fr, le DNS retourne 93.184.216.34. Enregistrements : A (IPv4), AAAA (IPv6), CNAME (alias), MX (mail), NS (serveur DNS de la zone). C'est ce qu'on utilise 99% du temps.",
  "Qu'est-ce qu'une zone DNS de recherche inversée ?": "Reverse Lookup Zone : IP → nom (l'inverse). Utilise des enregistrements PTR. Sert pour les logs (afficher des noms au lieu d'IP), la sécurité antispam, et les outils de diagnostic. Souvent oubliée mais utile en entreprise.",
  "Qu'est-ce que ADDS ?": "Active Directory Domain Services : le rôle Windows Server qui fournit l'annuaire complet (utilisateurs, groupes, ordinateurs, GPO, authentification Kerberos). C'est le rôle qu'on installe pour transformer un Windows Server en contrôleur de domaine. À distinguer de AD LDS (Lightweight, sans domaine).",
  "Qu'est-ce que GLPI ?": "GLPI (Gestionnaire Libre de Parc Informatique) est l'outil open-source #1 en France pour gérer un service IT. Il combine helpdesk (tickets) et inventaire matériel/logiciel (souvent via OCS Inventory ou son agent FusionInventory). Gratuit, modulaire (plugins), interface web. Largement attendu en entreprise française.",
  "Qu'est-ce que IaaS ?": "Infrastructure as a Service : tu loues le matériel virtuel (CPU, RAM, disque, réseau), tu gères TOUT le reste (OS, middleware, application). Exemple : AWS EC2, Azure Virtual Machines, OVH. Maximum de flexibilité mais maximum de gestion. Pour quand tu as des besoins atypiques ou un OS spécifique.",
  "Qu'est-ce que MDT ?": "Microsoft Deployment Toolkit : outil GRATUIT de Microsoft pour automatiser les déploiements Windows. Permet de créer des séquences de tâches (Task Sequence) qui orchestrent : install OS + drivers + apps + config. Utilise WDS/PXE pour le déploiement réseau. Plus puissant que WDS seul. Alternative pro : SCCM/MEM.",
  "Qu'est-ce que Microsoft Exchange ?": "Serveur de messagerie d'entreprise Microsoft : gère emails, calendriers, contacts, salles de réunion, ressources partagées. Versions on-premise (à installer chez soi) ou Online (cloud, dans Microsoft 365). Le standard de fait dans 80% des entreprises moyennes/grandes. Couplé étroitement avec Outlook et Active Directory.",
  "Qu'est-ce que PXE ?": "Preboot eXecution Environment : permet à un PC sans OS de démarrer via le RÉSEAU pour télécharger et installer un système. La carte réseau a un firmware qui demande une IP DHCP, télécharge un bootloader (TFTP), puis l'image OS. Indispensable pour déployer des dizaines/centaines de PC. Sous Windows : couplé avec WDS et MDT.",
  "Qu'est-ce que PaaS ?": "Platform as a Service : le fournisseur gère matériel + OS + middleware (base de données, runtime), TU déploies juste ton application. Exemples : Azure App Service, Heroku, Google App Engine. Idéal pour les développeurs : pas de patch OS à gérer, focus sur le code.",
  "Qu'est-ce que SNMP ?": "Simple Network Management Protocol : protocole STANDARD pour superviser les équipements réseau. Le serveur de supervision INTERROGE (poll) les équipements (port UDP 161) qui répondent avec leurs métriques. Versions : SNMPv1 et v2 (en clair, à éviter), SNMPv3 (chiffré, recommandé). Tous les équipements pro le supportent.",
  "Qu'est-ce que SSH ?": "Secure Shell : protocole de connexion à distance chiffrée (port 22). Remplaçant indispensable de Telnet (qui était en clair). Permet de prendre la main sur un serveur Linux/Unix, exécuter des commandes, transférer des fichiers (scp, sftp), faire des tunnels. Au cœur du métier d'admin Linux.",
  "Qu'est-ce que SaaS ?": "Software as a Service : TOUT est géré par le fournisseur, tu utilises juste l'application via le web. Exemples : Office 365, Gmail, Salesforce, Dropbox. Le modèle dominant aujourd'hui : pas d'install, pas de mise à jour, abonnement mensuel. Confidentialité à vérifier (où sont les données).",
  "Qu'est-ce que Syslog ?": "Protocole STANDARD pour la centralisation des journaux d'événements. Les équipements (Linux, switches, firewalls) envoient leurs logs (port UDP 514) à un serveur Syslog central qui stocke tout. Permet : analyse centralisée, corrélation d'événements, conformité (RGPD, ISO27001 demandent une journalisation centralisée). Évolutions : rsyslog, syslog-ng.",
  "Qu'est-ce que Sysprep ?": "Outil Microsoft (System Preparation) qui prépare une image Windows pour le clonage en supprimant les éléments uniques : SID (identifiant de sécurité), nom de machine, données d'activation, etc. Sans Sysprep, deux machines clonées auraient le même SID → catastrophe pour l'AD. Lancé en fin de préparation, avant la capture (Capture Image).",
  "Qu'est-ce que WDS ?": "Windows Deployment Services : rôle Windows Server qui permet de déployer des images Windows via PXE. Inclut un serveur TFTP pour le boot et un serveur d'images. Souvent couplé avec MDT pour des séquences plus avancées (post-install, drivers, applications). Module fondamental pour un TSSR qui gère un parc Windows.",
  "Qu'est-ce que WPA2/WPA3 Enterprise ?": "Mode 'Enterprise' du WPA2/WPA3 : chaque utilisateur a SES PROPRES identifiants (typiquement liés à l'AD via RADIUS, port 1812). Bien plus sûr que WPA2 Personal (mot de passe partagé). Avantage : on peut révoquer un utilisateur sans changer le mot de passe Wi-Fi de toute l'entreprise. Standard en entreprise.",
  "Qu'est-ce que WSUS ?": "Windows Server Update Services : serveur centralisé qui télécharge les mises à jour Microsoft UNE FOIS et les distribue ensuite à tous les postes du réseau. Économise la bande passante Internet, permet de tester les patchs avant déploiement (groupes pilotes), et de planifier les déploiements. Indispensable dans les grandes infrastructures.",
  "Qu'est-ce que l'Active Directory (AD) ?": "L'AD est l'annuaire centralisé de Microsoft : il stocke utilisateurs, groupes, ordinateurs, imprimantes, etc. dans une base hiérarchique. Quand tu te logues sur un PC du domaine, c'est l'AD qui valide tes identifiants. Couplé aux GPO, il pilote tous les paramètres des postes du parc. Présent dans 95% des entreprises de plus de 50 employés.",
  "Qu'est-ce que l'adresse de broadcast ?": "La dernière adresse d'un réseau (tous les bits hôtes à 1) : sert à envoyer un message à TOUS les hôtes du réseau simultanément. Ex : pour 192.168.1.0/24, le broadcast est 192.168.1.255. Utilisée par DHCP, ARP, et autres protocoles de découverte. Non routée par les routeurs (limitée au réseau local).",
  "Qu'est-ce que l'encapsulation dans le modèle OSI ?": "Quand des données traversent les 7 couches de haut en bas (côté émetteur), chaque couche ajoute son propre en-tête. Les données HTTP sont 'emballées' dans un segment TCP, puis dans un paquet IP, puis dans une trame Ethernet. À la réception, c'est l'inverse : désencapsulation.",
  "Qu'est-ce que l'écoresponsabilité numérique ?": "Réduire l'impact environnemental de l'IT : ALLONGER la durée de vie du matériel (réparer plutôt que remplacer), ÉTEINDRE les postes inutiles, OPTIMISER les serveurs (virtualisation), choisir des hébergeurs verts, recycler les DEEE. Le numérique = 4% des émissions CO2 mondiales et ça monte. Sujet important pour les certifications et l'examen.",
  "Qu'est-ce que la QoS en VoIP ?": "Quality of Service : mécanismes qui PRIORISENT les flux voix sur le réseau pour garantir la qualité d'appel (pas de coupures, pas de hachures, pas de latence). Réalisé par : marquage DSCP des paquets voix, files d'attente prioritaires sur les routeurs, dimensionnement de la bande passante. SANS QoS = qualité audio inutilisable dès que le réseau est chargé.",
  "Qu'est-ce que la VoIP ?": "Voice over IP : transport de la voix (téléphonie) via le RÉSEAU IP (Internet ou réseau interne) au lieu du réseau téléphonique traditionnel (RTC). Avantages : un seul câblage (réseau et téléphone), coût réduit (appels gratuits en interne), fonctionnalités modernes (transferts, conférences, présence). DEVENU LA NORME : le RTC s'arrête en France progressivement.",
  "Qu'est-ce que la gigue (jitter) ?": "Variation du DÉLAI entre les paquets voix qui arrivent. Si les paquets arrivent espacés de manière irrégulière (parfois 10ms, parfois 100ms), la voix est hachée. Pour la VoIP, on tolère < 30ms de gigue. Solution : buffer de gigue (jitter buffer) côté téléphone qui lisse en stockant temporairement.",
  "Qu'est-ce que la haute disponibilité (HA) ?": "Capacité d'un système à rester opérationnel même en cas de panne. Mesurée en 'neufs' : 99,9% (3 neufs) = 8h d'arrêt/an. 99,99% (4 neufs) = 52 min/an. 99,999% (5 neufs) = 5 min/an. Réalisé par : redondance (2 serveurs au lieu d'un), basculement auto (failover), clusters.",
  "Qu'est-ce que la journalisation (logging) ?": "Enregistrement automatique des événements système et réseau dans des journaux (logs). Indispensable pour : diagnostiquer les pannes, détecter les attaques, prouver la conformité. Centralisation conseillée (Syslog + SIEM type Wazuh, Graylog, Splunk). Sans logs, pas de forensique possible après incident.",
  "Qu'est-ce que la migration à chaud (vMotion) ?": "Déplacer une VM en cours d'exécution d'un hôte physique vers un autre, SANS interruption. La RAM est copiée à chaud, puis la VM bascule en quelques millisecondes. Utile pour : maintenance d'un serveur sans downtime, équilibrage automatique de charge. Nom Microsoft : Live Migration. Demande un stockage partagé.",
  "Qu'est-ce que la règle de sauvegarde 3-2-1 ?": "Règle d'or de la sauvegarde : 3 COPIES des données / sur 2 SUPPORTS différents / dont 1 HORS SITE. Pourquoi : un disque peut tomber en panne, un site peut brûler, un cryptolocker peut détruire les sauvegardes locales. Cette règle te protège de tous les scénarios catastrophe. Variante moderne 3-2-1-1-0 : +1 copie immuable +0 erreur de restauration.",
  "Qu'est-ce que la supervision réseau ?": "Surveillance EN CONTINU des équipements (switches, routeurs, serveurs), services et performances pour détecter les anomalies AVANT que les utilisateurs ne s'en rendent compte. Mesure : disponibilité (up/down), CPU/RAM/disque, bande passante, temps de réponse. Outils : Nagios, Zabbix, Centreon, PRTG, Grafana. Pilier de la fiabilité IT.",
  "Qu'est-ce que la veille technologique pour un TSSR ?": "Se TENIR INFORMÉ en continu des évolutions IT : nouvelles versions logicielles, FAILLES DE SÉCURITÉ (CVE), nouveaux outils, bonnes pratiques. Sources : sites spécialisés (Le Monde Informatique, ZDNet), bulletins ANSSI, newsletters constructeurs, podcasts, conférences. Faire de la veille n'est pas optionnel, c'est CRUCIAL pour rester pertinent.",
  "Qu'est-ce que le FSMO dans l'AD ?": "Flexible Single Master Operations : 5 rôles uniques répartis sur les contrôleurs de domaine. Schema Master (modif schéma), Domain Naming Master (forêt), RID Master (génère SID), PID Emulator (synchro temps + compat anciennes versions), Infrastructure Master (refs cross-domaine). Si un DC porteur tombe, on transfère le rôle. À connaître : ces 5 rôles tombent souvent à l'examen.",
  "Qu'est-ce que le MFA ?": "Multi-Factor Authentication : exige au minimum 2 preuves d'identité de catégories différentes : ce qu'on SAIT (mot de passe), ce qu'on POSSÈDE (téléphone, token, badge), ce qu'on EST (biométrie). Bloque 99% des attaques sur compte (même si le mot de passe est volé). DEVENU INDISPENSABLE en 2025, surtout pour les comptes admin.",
  "Qu'est-ce que le NAT ?": "Network Address Translation : traduit une (ou plusieurs) IP privée(s) du réseau interne en IP publique pour sortir sur Internet. Sans NAT, on aurait épuisé les IPv4 depuis longtemps. Réalisé par la box Internet ou le routeur d'entreprise. Variante : SNAT (source), DNAT (destination, pour publier un service).",
  "Qu'est-ce que le PAT ?": "Port Address Translation : variante du NAT qui permet à PLUSIEURS machines internes d'utiliser UNE SEULE IP publique en jouant sur les ports source. Aussi appelé NAT overload ou Masquerade (sur iptables Linux). C'est ce qui se passe chez toi : ta box a 1 IP publique, et tes 10 appareils sortent avec.",
  "Qu'est-ce que le RAID 0 ?": "Striping (entrelacement) sans aucune redondance : les données sont DÉCOUPÉES et réparties sur 2+ disques en parallèle pour MAXIMISER LA VITESSE. Inconvénient MAJEUR : aucune tolérance à la panne — si UN disque tombe, TOUTES les données sont perdues. À n'utiliser que pour des données non critiques (cache, fichiers temporaires).",
  "Qu'est-ce que le RAID 1 ?": "Mirror : 2 disques identiques contiennent EXACTEMENT les mêmes données. Si un disque tombe, l'autre prend immédiatement le relais sans coupure. Sécurité : tolère 1 panne de disque. Coût : on perd 50% de la capacité (2 disques de 1To = 1To utile). Idéal pour le système ou des petits volumes critiques.",
  "Qu'est-ce que le RAID 10 (1+0) ?": "RAID 1+0 : combine miroir (RAID 1) + striping (RAID 0). On crée des couples miroir, puis on fait du striping entre eux. Minimum 4 disques, capacité utilisable = 50%. Avantages : performance ÉLEVÉE (lecture+écriture) ET tolérance à plusieurs pannes (selon les couples). RECOMMANDÉ pour les bases de données et workloads exigeants.",
  "Qu'est-ce que le RAID 5 ?": "Striping avec parité : données réparties sur 3+ disques avec un bloc de parité distribué. Tolère 1 panne de disque. Capacité utilisable : (N-1) * taille du plus petit. Bon compromis perf/sécurité/coût. Inconvénient : reconstruction lente après remplacement de disque, et risque pendant la reconstruction → préférer RAID 6 ou 10 sur gros volumes.",
  "Qu'est-ce que le RAID 6 ?": "Striping avec DOUBLE parité : données réparties + 2 blocs de parité distribués. Tolère la panne SIMULTANÉE de 2 disques. Minimum 4 disques. Capacité utilisable : (N-2) * taille du plus petit. Plus sûr que RAID 5 mais 1 disque de plus 'perdu' en parité. Recommandé sur baies de stockage modernes (gros disques = reconstruction longue).",
  "Qu'est-ce que le RPO ?": "Recovery Point OBJECTIVE : quantité maximum de données qu'on accepte de PERDRE. Si RPO = 1h, on doit avoir une sauvegarde de moins d'1h. RPO 1h = sauvegarde toutes les heures. RPO 24h = sauvegarde quotidienne. Définition métier : combien de DONNÉES pouvons-nous accepter de perdre ?",
  "Qu'est-ce que le RTO ?": "Recovery Time OBJECTIVE : durée MAXIMUM acceptable entre la panne et la remise en service. Si RTO = 4h, on doit être de retour sous 4h. Plus le RTO est court, plus l'infra coûte cher (HA, redondance). Définition métier : combien de TEMPS pouvons-nous accepter d'être en panne ?",
  "Qu'est-ce que le WOL ?": "Wake on LAN : technologie permettant d'allumer un PC à distance en envoyant un 'magic packet' réseau spécial à son adresse MAC. La carte réseau, même éteinte, écoute ces paquets si activée. Très utilisé pour : lancer des sauvegardes nocturnes, déployer des patchs, allumer un PC avant intervention.",
  "Qu'est-ce que le filtrage MAC ?": "Autoriser uniquement les appareils dont l'adresse MAC (identifiant unique de la carte réseau) est dans une liste blanche. Sécurité supplémentaire en Wi-Fi ou sur switch. ATTENTION : faiblesse — les MAC peuvent être facilement usurpées (spoofing). À combiner avec d'autres mesures, jamais seul.",
  "Qu'est-ce que le filtrage URL ?": "Bloquer l'accès à des sites web selon une liste noire (URLs précises) ou des catégories (pornographie, jeux d'argent, etc.). Réalisé par un proxy (Squid + SquidGuard) ou un firewall NextGen (Stormshield, Fortinet). Utile pour la productivité, la sécurité (anti-phishing) et la conformité.",
  "Qu'est-ce que le phishing ?": "Le phishing (hameçonnage) est la #1 des attaques aujourd'hui. L'attaquant se fait passer pour quelqu'un de confiance (banque, DSI, collègue) via email/SMS pour piéger ta vigilance et te faire cliquer ou révéler des infos. Parade : sensibilisation utilisateur, filtrage anti-spam, MFA pour limiter l'impact d'un mot de passe volé.",
  "Qu'est-ce que le pipe (|) en Bash ?": "Même principe que PowerShell mais avec du TEXTE : la sortie standard d'une commande devient l'entrée de la suivante. Ex : cat fichier.txt | grep \"erreur\" | wc -l (compter les lignes contenant 'erreur'). Très puissant pour combiner des outils Unix qui font chacun une chose simple.",
  "Qu'est-ce que le pipe (|) en PowerShell ?": "Le pipe envoie la SORTIE d'une cmdlet comme ENTRÉE de la suivante, mais en passant des OBJETS .NET (pas du texte). Ex : Get-Process | Where-Object {$_.CPU -gt 100} | Select-Object Name, CPU. C'est la signature de PowerShell : composer des actions complexes en chaînant des cmdlets simples.",
  "Qu'est-ce que le principe du moindre privilège ?": "Donner à chaque utilisateur UNIQUEMENT les droits strictement nécessaires à son travail — pas un de plus. Un commercial n'a pas besoin d'admin local. Un comptable n'a pas accès aux dossiers RH. Limite drastiquement les dégâts en cas de compte compromis ou d'erreur humaine.",
  "Qu'est-ce que le protocole EAS ?": "Exchange ActiveSync : protocole propriétaire Microsoft pour synchroniser email + contacts + calendrier entre Exchange et appareils mobiles (iPhone, Android). Permet le push (les mails arrivent en temps réel) et la gestion à distance (effacement en cas de perte). Standard sur tous les smartphones modernes.",
  "Qu'est-ce que le protocole ICMP ?": "Internet Control Message Protocol (couche 3) : sert aux diagnostics et messages d'erreur réseau. Utilisé par ping (echo request/reply) et traceroute. Aussi : 'Destination Unreachable', 'Time Exceeded'. Souvent filtré par les firewalls externes (mais pas en interne, sinon on ne diagnostique plus rien).",
  "Qu'est-ce que le protocole RTP ?": "Real-time Transport Protocol : transporte le flux AUDIO/VIDÉO en temps réel. Utilise UDP (rapide, on ne retransmet pas un paquet voix perdu — ça arriverait trop tard). Numéros de séquence pour reconstruire l'ordre. Couplé avec RTCP pour le contrôle qualité. SIP = signalisation, RTP = média audio/vidéo.",
  "Qu'est-ce que le protocole SIP ?": "Session Initiation Protocol : protocole STANDARD pour établir, modifier et terminer les sessions VoIP. Utilisé pour la signalisation (qui appelle qui, quand raccrocher). Port 5060 (TCP/UDP en clair) ou 5061 (chiffré TLS). C'est le 'téléphone' qui appelle, le 'décrochage' et la 'terminaison'. Le flux audio lui passe par RTP.",
  "Qu'est-ce que le routage inter-VLAN ?": "Pour qu'un VLAN parle à un autre VLAN, il faut router (couche 3) entre eux. Réalisé par : routeur sur un trunk ('Router on a stick'), ou switch L3 (qui fait routage + commutation). Sans routage, les VLAN sont totalement isolés — c'est parfois voulu pour la sécurité.",
  "Que contient un bail DHCP ?": "Un bail DHCP contient : l'adresse IP attribuée, le masque de sous-réseau, la passerelle (gateway), les DNS, et la durée de validité. Quand le bail expire à 50%, le client demande un renouvellement. Bonne pratique : durée courte (8h) en réseau wifi/visiteur, plus longue (8 jours) en LAN stable.",
  "Que signifie \"*/5 * * * *\" en cron ?": "Exécuter la tâche TOUTES les 5 minutes (à :00, :05, :10, ..., :55), chaque heure, chaque jour. Le */5 dans le champ minute signifie 'tous les 5'. Autres exemples : 0 2 * * * (chaque jour à 2h00), 0 0 * * 0 (chaque dimanche à minuit), @reboot (au démarrage).",
  "Que signifie \"Did you try restarting?\" ?": "Question N°1 du support : 'Avez-vous essayé de redémarrer ?'. À poser systématiquement avant tout diagnostic. Le redémarrage résout 30 à 50% des incidents (caches vidés, services relancés, connexions rétablies).",
  "Que signifie \"I will check the logs\" ?": "'Je vais vérifier les journaux'. Phrase incontournable du support technique. Les logs Windows (Event Viewer), Linux (/var/log) ou applicatifs sont la première source de vérité quand un incident est rapporté.",
  "Que signifie \"Please describe the issue\" ?": "'Veuillez décrire le problème'. 'Issue' = problème, ennui (terme plus diplomatique que 'problem'). Question d'ouverture classique d'un ticket de support : laisse l'utilisateur expliquer en ses mots.",
  "Que signifie \"The server is back online\" ?": "'Le serveur est de nouveau en ligne'. Phrase rassurante à envoyer aux utilisateurs après une intervention. 'Online' = en ligne, opérationnel. 'Offline' = hors ligne, indisponible.",
  "Que signifie \"patch management\" ?": "'Gestion des correctifs'. Processus organisé de déploiement des patchs de sécurité et corrections de bugs. WSUS sous Windows, apt/yum sous Linux. Activité critique pour la cybersécurité — un patch tardif = une vulnérabilité exploitable.",
  "Que signifie ITIL ?": "Information Technology Infrastructure Library : un cadre méthodologique mondial qui structure la gestion des services IT. Il définit le vocabulaire (incident, problème, changement, demande) et les processus à suivre. Les certifications ITIL Foundation puis Practitioner sont valorisées sur le CV d'un TSSR.",
  "Que signifient les droits 755 ?": "Chaque chiffre = somme de 4 (lecture) + 2 (écriture) + 1 (exécution). 7 = 4+2+1 = rwx (tous droits). 5 = 4+1 = r-x (lecture + exécution). 755 = propriétaire tout, groupe et autres : lecture+exécution. Standard pour les scripts et binaires. 644 (rw-r--r--) standard pour les fichiers de config.",
  "Quel est l'outil de ticketing libre le plus utilisé ?": "GLPI (Gestionnaire Libre de Parc Informatique) est l'outil open source de référence en France. Il combine gestion de tickets et gestion de parc (inventaire matériel/logiciel). Gratuit, énorme communauté, plugins nombreux. Alternative payante : ServiceNow (gros groupes), Jira Service Management.",
  "Quel est le PDU (unité de données) de la couche 2 ?": "La trame (frame en anglais) est l'unité de données de la couche 2. Elle contient : adresse MAC source, MAC destination, payload (données venant de la couche 3), et un FCS (CRC) pour détecter les erreurs. Sur Ethernet, taille typique : 1518 octets max (avec jumbo frames jusqu'à 9000).",
  "Quel est le PDU de la couche 3 ?": "Le paquet (packet) est l'unité de la couche 3. Il contient : IP source, IP destination, TTL (Time To Live, anti-boucle), protocole (TCP=6, UDP=17, ICMP=1), et le payload. C'est ce que les routeurs analysent pour décider du chemin.",
  "Quel est le PDU de la couche 4 ?": "TCP utilise des SEGMENTS, UDP utilise des DATAGRAMMES. Les deux contiennent : port source, port destination, payload, et des champs de contrôle (numéros de séquence pour TCP, checksum). C'est ici qu'on identifie l'application destinataire (port 443 = serveur web, port 22 = SSH, etc).",
  "Quel est le format d'une ligne crontab ?": "5 champs séparés par des espaces : minute (0-59) heure (0-23) jour-du-mois (1-31) mois (1-12) jour-semaine (0-7, dim=0 ou 7), suivis de la commande. Exemple : '30 8 * * 1-5 /usr/bin/script.sh' = à 8h30 du lundi au vendredi.",
  "Quel est le masque de /25 ?": "/25 = 25 bits réseau = 11111111.11111111.11111111.10000000 = 255.255.255.128. Comprends-le bien : on a juste 'pris' 1 bit du dernier octet pour faire 2 sous-réseaux d'un /24. Idéal pour partager une plage en deux moitiés.",
  "Quel est le masque de /26 ?": "/26 = 26 bits réseau = 11111111.11111111.11111111.11000000 = 255.255.255.192. On a pris 2 bits du dernier octet → 4 sous-réseaux possibles. 192 = 128 + 64 (les 2 premiers bits à 1).",
  "Quel est le masque de /27 ?": "/27 = 27 bits réseau = 11111111.11111111.11111111.11100000 = 255.255.255.224. On a pris 3 bits du dernier octet → 8 sous-réseaux possibles. 224 = 128 + 64 + 32.",
  "Quel est le masque de /28 ?": "/28 = 28 bits réseau = 11111111.11111111.11111111.11110000 = 255.255.255.240. On a pris 4 bits du dernier octet → 16 sous-réseaux. 240 = 128 + 64 + 32 + 16.",
  "Quel est le rôle du serveur DHCP ?": "Distribuer automatiquement aux postes : adresse IP, masque, passerelle (gateway), DNS, et autres options (NTP, WPAD...). Sans DHCP, il faudrait configurer chaque PC à la main. Bonne pratique : 2 serveurs DHCP en HA (failover ou split scope) car DHCP en panne = nouveaux postes sans réseau.",
  "Quel est le rôle du serveur DNS dans un domaine AD ?": "Le DNS est INDISPENSABLE à l'AD : les clients trouvent les contrôleurs de domaine via des enregistrements SRV dans la zone DNS du domaine. Sans DNS qui marche, pas d'authentification, pas de Kerberos, pas de GPO. C'est pour ça qu'un DC héberge presque toujours aussi le DNS.",
  "Quel fichier configure le réseau sous Debian ?": "Ancien : /etc/network/interfaces (Debian 9 et avant). Moderne sur Ubuntu : /etc/netplan/*.yaml. Sur RedHat/CentOS : /etc/sysconfig/network-scripts/ifcfg-* (ancien) ou via NetworkManager. Toujours faire un backup avant édition !",
  "Quel fichier configure les résolutions DNS sous Linux ?": "/etc/resolv.conf : liste les serveurs DNS (lignes 'nameserver IP'). Attention sur les distros modernes : ce fichier est souvent généré dynamiquement par NetworkManager ou systemd-resolved. Pour le rendre permanent, modifier la conf de NetworkManager/netplan en amont.",
  "Quel fichier contient les mots de passe hashés sous Linux ?": "/etc/shadow contient les mots de passe hashés (chiffrés). Lisible UNIQUEMENT par root (droits 640 propriétaire root). Crucial pour la sécurité : si un attaquant le récupère, il peut tenter du brute-force offline. Toujours protégé par les droits stricts.",
  "Quel fichier contient les utilisateurs sous Linux ?": "/etc/passwd contient tous les utilisateurs locaux : login, UID, GID, nom complet, home, shell. Lisible par tous (par défaut), mais ne contient PAS les mots de passe (déplacés dans /etc/shadow pour des raisons de sécurité). Format : login:x:UID:GID:nom:home:shell.",
  "Quel port utilise DHCP ?": "DHCP utilise 2 ports UDP : 67 (côté SERVEUR, qui écoute les demandes des clients) et 68 (côté CLIENT, qui reçoit les réponses du serveur). En UDP car la machine n'a pas encore d'IP, donc pas de connexion TCP possible. Process : DHCP DISCOVER → OFFER → REQUEST → ACK (mnémo DORA).",
  "Quel port utilise DNS ?": "DNS (Domain Name System) utilise le port 53. Il fonctionne principalement en UDP (rapide pour résolutions classiques) mais bascule en TCP pour les transferts de zones et grosses réponses. Sans DNS, Internet ne marche pas : c'est l'annuaire qui traduit 'google.com' en adresse IP.",
  "Quel port utilise FTP (données) ?": "FTP utilise 2 ports : 21 pour les COMMANDES (login, navigation) et 20 pour les DONNÉES (transfert). C'est le mode 'actif'. En mode 'passif' (utilisé par la plupart des navigateurs), le port de données est négocié dynamiquement. ATTENTION : FTP transmet TOUT en clair, préférer SFTP (port 22) ou FTPS.",
  "Quel port utilise FTP ?": "FTP utilise 2 ports : 21 pour les commandes (login, navigation) et 20 pour le transfert de données. Attention : FTP transmet TOUT en clair (mot de passe inclus). Préfère SFTP (sur SSH, port 22) ou FTPS (FTP + TLS).",
  "Quel port utilise HTTP ?": "HTTP utilise le port 80 en TCP. C'est le protocole web NON sécurisé : tout circule en clair, n'importe qui sur le chemin peut lire les données. À éviter pour tout ce qui contient des mots de passe ou données sensibles. Aujourd'hui les navigateurs préfèrent HTTPS.",
  "Quel port utilise HTTPS ?": "HTTPS = HTTP + TLS, sur le port 443 en TCP. Les données sont chiffrées de bout en bout grâce à un certificat SSL/TLS. C'est pour ça que tu vois un cadenas dans la barre d'adresse. Indispensable pour les sites bancaires, les mails, et de plus en plus universel.",
  "Quel port utilise IMAP ?": "IMAP (Internet Message Access Protocol) utilise le port 143. Il synchronise les mails entre le serveur et tous tes appareils — c'est pour ça que ton mail lu sur le téléphone apparaît lu sur l'ordi. Version sécurisée : IMAPS sur 993.",
  "Quel port utilise Kerberos ?": "Kerberos utilise le port 88 (TCP/UDP). C'est le protocole d'authentification d'Active Directory : il distribue des 'tickets' qui prouvent ton identité pendant un certain temps. Beaucoup plus sûr que les mots de passe transmis directement.",
